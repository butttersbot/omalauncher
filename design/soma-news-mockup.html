<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Soma News: mock-up</title>
<!--
  Soma's personal news (Boss, 2026-10-21, after Tailscale's FreshRSS post). Second pass, his notes: "a more editorial
  look, should read like a magazine, needs more pictures; no 'this morning' header; a stream with a manual refresh
  (on its own once an hour); the home widget in small, medium and large". FreshRSS on the Mac Pro collects the feeds,
  Grok brings in the X accounts he picks. A mock-up only: the stories are sample text, the photos made by Grok.
-->
<style>
  @font-face { font-family: "M Display"; src: url(../app/src/main/assets/packs/manga/fonts/DelaGothicOne-Regular.ttf); }
  @font-face { font-family: "M Body"; src: url(../app/src/main/assets/packs/manga/fonts/SchibstedGrotesk.ttf); }
  @font-face { font-family: "M Mono"; src: url(../app/src/main/assets/packs/manga/fonts/JetBrainsMono.ttf); }
  :root { --paper: #fbfaf6; --ink: #111113; --muted: #74737a; --red: #d7262d; --rule: #d9d6cf; --serif: "Noto Serif", Georgia, "Times New Roman", serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #26262a; overflow: hidden; font: 15px/1.45 "M Body", system-ui, sans-serif; color: var(--ink); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  img { display: block; width: 100%; object-fit: cover; }
  .kicker { font: 600 10.5px/1 "M Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--red); }
  .meta { font: 10.5px/1.3 "M Mono", monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .serif { font-family: var(--serif); }
  .top { position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 6px; }
  .seg { display: flex; background: #fdfdfb; border: 2px solid var(--ink); }
  .seg button { padding: 5px 9px; font-size: 12.5px; white-space: nowrap; }
  .seg button.on { background: var(--ink); color: #fdfdfb; }
  .stage { position: fixed; left: 0; right: 0; bottom: 0; display: grid; place-items: center; }
  .scaler { position: relative; }
  .phone { position: relative; overflow: hidden; background: var(--paper); border-radius: 22px; box-shadow: 0 10px 40px rgba(0,0,0,.5); transform-origin: top left; display: flex; flex-direction: column; }
  .phone.cover { width: 412px; height: 960px; }
  .phone.portrait { width: 700px; height: 840px; }
  .phone.landscape { width: 840px; height: 700px; }
  .scroll { flex: 1; overflow-y: auto; scrollbar-width: none; position: relative; }

  /* The masthead: small, the stream is the point. Refresh by hand, or a pull. */
  .mast { padding: 36px 18px 10px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--ink); background: var(--paper); z-index: 4; }
  .mast .name { font-family: "M Display"; font-size: 22px; letter-spacing: .02em; flex: 1; }
  .refresh { display: flex; align-items: center; gap: 8px; }
  .refresh .ic { width: 34px; height: 34px; border: 1.3px solid var(--ink); border-radius: 50%; display: grid; place-items: center; font-size: 17px; }
  .refresh.spin .ic { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .newpill { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 7px 14px; border-radius: 18px; font-size: 13px; z-index: 6; box-shadow: 0 4px 14px rgba(0,0,0,.25); cursor: pointer; }

  /* The stream: a magazine's run of layouts, not one card repeated. */
  .cover-story { position: relative; color: #fff; cursor: pointer; }
  .cover-story img { height: 470px; }
  .cover-story .over { position: absolute; left: 0; right: 0; bottom: 0; padding: 70px 20px 20px; background: linear-gradient(transparent, rgba(0,0,0,.82)); }
  .cover-story .kicker { color: #ffd166; }
  .cover-story h1 { font-family: var(--serif); font-weight: 700; font-size: 31px; line-height: 1.1; margin: 8px 0 8px; letter-spacing: -.01em; }
  .cover-story p { margin: 0; font-family: var(--serif); font-style: italic; font-size: 16px; opacity: .92; }
  .section { padding: 22px 18px 6px; display: flex; align-items: baseline; gap: 10px; }
  .section h4 { margin: 0; font: 700 13px "M Mono"; letter-spacing: .14em; text-transform: uppercase; }
  .section::after { content: ""; flex: 1; border-top: 1px solid var(--ink); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 10px 18px 6px; }
  .card { cursor: pointer; }
  .card img { height: 150px; margin-bottom: 8px; }
  .card h3 { font-family: var(--serif); font-size: 17px; line-height: 1.22; margin: 6px 0 4px; }
  .card p { margin: 0; color: #444; font-size: 13.5px; font-family: var(--serif); }
  .card .meta { margin-top: 6px; }
  .quote { margin: 18px 18px 6px; padding: 18px 18px 14px; background: #111113; color: #f6f4ee; position: relative; cursor: pointer; }
  .quote .mark { font-family: var(--serif); font-size: 64px; line-height: .6; color: var(--red); }
  .quote blockquote { margin: 6px 0 12px; font-family: var(--serif); font-size: 21px; line-height: 1.3; font-style: italic; }
  .quote .who { display: flex; align-items: center; gap: 10px; }
  .quote .av { width: 30px; height: 30px; border-radius: 50%; background: #f6f4ee; color: #111; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .quote .meta { color: #a7a6ad; }
  .feature { display: grid; grid-template-columns: 42% 1fr; gap: 14px; padding: 16px 18px 6px; cursor: pointer; align-items: start; }
  .feature img { height: 170px; }
  .feature h3 { font-family: var(--serif); font-size: 19px; line-height: 1.2; margin: 6px 0 6px; }
  .feature p { margin: 0; font-family: var(--serif); color: #444; font-size: 14px; }
  .briefs { padding: 6px 18px 4px; counter-reset: b; }
  .brief { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--rule); cursor: pointer; align-items: center; }
  .brief::before { counter-increment: b; content: counter(b); font-family: "M Display"; font-size: 24px; color: var(--red); width: 24px; flex: none; }
  .brief .t { flex: 1; font-family: var(--serif); font-size: 15.5px; line-height: 1.3; }
  .brief img { width: 58px; height: 58px; flex: none; }
  .photo { margin: 18px 0 6px; cursor: pointer; }
  .photo img { height: 300px; }
  .photo .cap { padding: 8px 18px 0; font-family: var(--serif); font-style: italic; color: #333; font-size: 14px; }
  .end { padding: 26px 18px 60px; text-align: center; color: var(--muted); }

  /* The open Fold, made for it (Boss, 2026-10-21: "optimize the layout for the open inner screen, make it feel designed
     specifically for this form factor"): two pages either side of the fold, nothing crossing the crease. Each spread is
     composed as a magazine's: the left page and the right page answer each other. */
  .spread { display: grid; grid-template-columns: 1fr 1fr; column-gap: 36px; padding: 0 22px; position: relative; }
  .spread::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: linear-gradient(transparent, var(--rule) 12%, var(--rule) 88%, transparent); }
  .spread + .spread { margin-top: 26px; }
  .page { min-width: 0; }
  .s-cover { position: relative; color: #fff; cursor: pointer; height: 100%; min-height: 560px; }
  .s-cover img { position: absolute; inset: 0; height: 100%; }
  .s-cover .over { position: absolute; inset: auto 0 0 0; padding: 90px 20px 22px; background: linear-gradient(transparent, rgba(0,0,0,.85)); }
  .s-cover .kicker { color: #ffd166; }
  .s-cover h1 { font-family: var(--serif); font-size: 32px; line-height: 1.08; margin: 10px 0 8px; }
  .s-cover p { margin: 0; font-family: var(--serif); font-style: italic; font-size: 15.5px; opacity: .92; }
  .tops h5 { margin: 0 0 6px; font: 700 12px "M Mono"; letter-spacing: .14em; text-transform: uppercase; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
  .top-item { display: grid; grid-template-columns: 1fr 96px; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--rule); cursor: pointer; }
  .top-item img { height: 96px; }
  .top-item h3 { font-family: var(--serif); font-size: 17px; line-height: 1.2; margin: 5px 0 4px; }
  .top-item p { margin: 0; font-family: var(--serif); font-size: 13.5px; color: #444; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .s-head { padding: 26px 22px 10px; display: flex; align-items: baseline; gap: 12px; }
  .s-head h4 { margin: 0; font-family: "M Display"; font-size: 22px; font-weight: normal; }
  .s-head::after { content: ""; flex: 1; border-top: 1px solid var(--ink); }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .duo .card img { height: 130px; }
  .s-quote { background: #111113; color: #f6f4ee; padding: 26px 24px; height: 100%; display: flex; flex-direction: column; justify-content: center; cursor: pointer; }
  .s-quote .mark { font-family: var(--serif); font-size: 90px; line-height: .55; color: var(--red); }
  .s-quote blockquote { margin: 10px 0 18px; font-family: var(--serif); font-size: 26px; line-height: 1.25; font-style: italic; }
  .s-quote .meta { color: #a7a6ad; }
  .s-feature img { height: 230px; margin-bottom: 10px; }
  .s-feature h3 { font-family: var(--serif); font-size: 22px; line-height: 1.15; margin: 6px 0 6px; }
  .s-feature p { margin: 0; font-family: var(--serif); color: #444; font-size: 14.5px; }
  .s-photo { cursor: pointer; }
  .s-photo img { height: 380px; }
  .s-photo .cap { padding-top: 8px; font-family: var(--serif); font-style: italic; color: #333; font-size: 14px; }
  .phone.landscape .s-cover { min-height: 470px; }
  .phone.landscape .s-photo img { height: 300px; }

  /* Reading on the open Fold: the stream stays on the left page, the story opens on the right. */
  .split { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  .split .list { overflow-y: auto; border-right: 1px solid var(--rule); scrollbar-width: none; padding: 6px 16px 30px; }
  .split .list .top-item.on { background: #fff3c4; margin: 0 -10px; padding: 13px 10px; }
  .split .art { overflow-y: auto; scrollbar-width: none; position: relative; }
  .split .art .hero { height: 240px; }

  /* The reader: the one Soma Notes uses, set as a magazine. */
  .rbar { padding: 34px 16px 10px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--ink); }
  .reader { padding: 0 0 70px; }
  .reader .hero { height: 300px; }
  .reader .body { padding: 18px 22px 0; font-family: var(--serif); font-size: 18px; line-height: 1.62; }
  .reader h1 { font-family: var(--serif); font-weight: 700; font-size: 30px; line-height: 1.12; margin: 10px 0 8px; }
  .reader .dek { font-style: italic; color: #444; font-size: 18px; margin: 0 0 14px; }
  .reader p { margin: 0 0 14px; }
  .reader p.first::first-letter { float: left; font-family: "M Display"; font-size: 58px; line-height: .85; padding: 6px 8px 0 0; color: var(--red); }
  .reader blockquote { margin: 18px 0; padding: 0 0 0 16px; border-left: 4px solid var(--red); font-size: 22px; font-style: italic; line-height: 1.35; }
  .reader figure { margin: 18px -22px; }
  .reader figure img { height: 220px; }
  .reader figcaption { padding: 6px 22px 0; font-size: 13px; color: var(--muted); font-style: italic; }
  .tools { position: absolute; left: 12px; right: 12px; bottom: 14px; display: flex; justify-content: space-around; border: 1.5px solid var(--ink); background: var(--paper); padding: 6px; box-shadow: 4px 4px 0 var(--ink); z-index: 5; }
  .tools button { font-size: 13px; padding: 6px 8px; }
  .book { flex: 1; overflow: hidden; margin: 16px 26px 0; position: relative; }
  .flow { height: 100%; column-fill: auto; transition: transform .35s cubic-bezier(.3,.7,.3,1); font-family: var(--serif); font-size: 17px; line-height: 1.6; }
  .flow img { height: 230px; break-inside: avoid; margin-bottom: 12px; }
  .flow h1 { font-family: var(--serif); font-size: 28px; line-height: 1.12; margin: 0 0 8px; }
  .flow p { margin: 0 0 12px; }
  .flow blockquote { margin: 14px 0; padding-left: 14px; border-left: 4px solid var(--red); font-style: italic; font-size: 20px; break-inside: avoid; }
  .book::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: var(--rule); }
  .turn { position: absolute; top: 0; bottom: 0; width: 22%; z-index: 3; cursor: pointer; }
  .turn.l { left: 0; } .turn.r { right: 0; }
  .folio { display: flex; justify-content: space-between; padding: 8px 26px 14px; }

  /* Home, the widget in its three sizes: small 2×2, medium 4×2, large 4×4. */
  .home { flex: 1; overflow-y: auto; background: radial-gradient(rgba(17,17,19,.13) 1px, transparent 1.3px) 0 0/5px 5px, #f1f0ec; padding: 44px 14px 30px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; grid-auto-rows: 86px; }
  .phone:not(.cover) .grid4 { grid-template-columns: repeat(8, 1fr); grid-auto-rows: 78px; }
  .label { grid-column: 1 / -1; align-self: end; margin-bottom: -4px; }
  .w { position: relative; overflow: hidden; border: 2px solid var(--ink); background: var(--paper); cursor: pointer; }
  .w.s { grid-column: span 2; grid-row: span 2; }
  .w.m { grid-column: span 4; grid-row: span 2; }
  .w.l { grid-column: span 4; grid-row: span 4; }
  .w.s img { height: 100%; }
  .w.s .over { position: absolute; inset: auto 0 0 0; padding: 26px 10px 9px; background: linear-gradient(transparent, rgba(0,0,0,.85)); color: #fff; }
  .w.s .over h3 { font-family: var(--serif); font-size: 14.5px; line-height: 1.18; margin: 4px 0 0; }
  .w.s .kicker { color: #ffd166; font-size: 9px; }
  .w.m { display: grid; grid-template-columns: 44% 1fr; }
  .w.m img { height: 100%; }
  .w.m .txt { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .w.m h3 { font-family: var(--serif); font-size: 16px; line-height: 1.2; margin: 0; }
  .w.m .next { font-family: var(--serif); font-size: 13px; color: #444; border-top: 1px solid var(--rule); padding-top: 6px; }
  .w.l { display: flex; flex-direction: column; }
  .w.l .lead { position: relative; height: 52%; }
  .w.l .lead img { height: 100%; }
  .w.l .lead .over { position: absolute; inset: auto 0 0 0; padding: 30px 12px 10px; background: linear-gradient(transparent, rgba(0,0,0,.85)); color: #fff; }
  .w.l .lead h3 { font-family: var(--serif); font-size: 19px; line-height: 1.15; margin: 4px 0 0; }
  .w.l .lead .kicker { color: #ffd166; }
  .w.l .rows { flex: 1; padding: 4px 12px; display: flex; flex-direction: column; justify-content: space-around; }
  .w.l .row { display: flex; gap: 10px; align-items: center; }
  .w.l .row img { width: 46px; height: 46px; flex: none; }
  .w.l .row span { font-family: var(--serif); font-size: 13.5px; line-height: 1.25; }
  .wfoot { position: absolute; right: 8px; top: 8px; background: rgba(251,250,246,.92); border: 1px solid var(--ink); padding: 1px 6px; font: 9.5px "M Mono"; letter-spacing: .06em; }
  .toast { position: absolute; left: 50%; bottom: 80px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 14px; z-index: 60; font-size: 13px; white-space: nowrap; }
</style>
</head>
<body>
<div class="top"><div class="seg" id="layouts"></div><div class="seg" id="scenes"></div></div>
<div class="stage" id="stage"><div class="scaler" id="scaler"><div class="phone" id="phone"></div></div></div>
<script>
const LAYOUTS = [['cover', 'Cover'], ['portrait', 'Open'], ['landscape', 'Open sideways']];
const SCENES = [['stream', 'Stream'], ['reader', 'Reader'], ['widgets', 'Widget sizes']];
const S = { layout: innerWidth < 600 ? 'cover' : innerWidth > innerHeight ? 'landscape' : 'portrait', scene: 'stream', spread: 0, toast: '', refreshing: false, fresh: 0, updated: '11:58' };
const P = n => `news-mock/${n}.jpg`;

function set(p) { Object.assign(S, p); render(); }
function toast(t) { S.toast = t; render(); setTimeout(() => { S.toast = ''; render(); }, 1500); }
const $ = id => document.getElementById(id);

// A refresh by hand: the stream asks the Mac Pro's FreshRSS for what came in since; new stories wait under a pill.
function refresh() {
  if (S.refreshing) return;
  set({ refreshing: true });
  setTimeout(() => set({ refreshing: false, fresh: 3, updated: '12:31' }), 1400);
}

function streamWide() {
  const item = (img, kick, h, p, on) => `<div class="top-item ${on ? 'on' : ''}" onclick="set({scene:'reader',spread:0})"><div><div class="kicker">${kick}</div><h3>${h}</h3><p>${p}</p></div><img src="${P(img)}"></div>`;
  const card = c => `<div class="card" onclick="set({scene:'reader',spread:0})"><img src="${P(c[0])}"><div class="kicker">${c[1]}</div><h3>${c[2]}</h3><p>${c[3]}</p><div class="meta">${c[4]}</div></div>`;
  return `<div class="mast"><span class="name">SOMA</span>
      <span class="refresh ${S.refreshing ? 'spin' : ''}"><span class="meta">${S.refreshing ? 'Updating…' : 'Updated ' + S.updated + ' · hourly'}</span><button class="ic" onclick="refresh()" title="Refresh">↻</button></span></div>
    <div class="scroll" id="scroll" style="padding-top:18px">
      ${S.fresh ? `<div class="newpill" onclick="set({fresh:0});document.getElementById('scroll').scrollTop=0">↑ ${S.fresh} new stories</div>` : ''}
      <div class="spread">
        <div class="page s-cover" onclick="set({scene:'reader',spread:0})"><img src="${P('server')}"><div class="over"><div class="kicker">Self-hosting · 5 sources</div>
          <h1>The case for reading the web on your own server again</h1><p>RSS never left. FreshRSS on your tailnet brings back the habit — and gives your agents something to read.</p></div></div>
        <div class="page tops"><h5>Top stories</h5>
          ${item('fold', 'Foldables · X', 'Foldable launchers are having a moment', 'Three developers you follow shared home screens built like notebooks.')}
          ${item('mic', 'Audio · Import AI', 'Speech-to-text that never leaves the phone', 'Smaller than Whisper small, and as accurate on the authors\' benchmark.')}
          ${item('desk', 'Tools · Hacker News', 'Agents that build on the phone itself', 'A new wave of setups runs the builder where the code is written.')}
          ${item('ramen', 'Food · YouTube', 'The Chinatown ramen counter you saved, reviewed', 'Fourteen minutes, mostly about the broth.')}
        </div>
      </div>
      <div class="s-head"><h4>Devices</h4></div>
      <div class="spread">
        <div class="page duo">${card(['fold', 'Foldables', 'Samsung\'s next cover screen, taller and brighter', 'The leak shows a hinge with less crease.', 'The Verge · 3h'])}${card(['desk', 'Tools', 'A keyboard that keeps your clipboard', 'Why the history belongs in the keyboard.', 'Bluesky · 5h'])}</div>
        <div class="page duo">${card(['neon', 'Night', 'Rain, neon and the return of the night walk', 'Phones stay in pockets after dark.', 'The Verge · 1d'])}${card(['train', 'Print', 'Why magazines on trains are back in Tokyo', 'The quiet hour has a format.', 'Monocle · 1d'])}</div>
      </div>
      <div class="spread" style="margin-top:30px">
        <div class="page s-quote" onclick="toast('Opens the post on X')"><div class="mark">“</div><blockquote>The home screen should be a notebook, not a grid of apps.</blockquote><div><b>@typecraft_dev</b><div class="meta">From your Android list · 2.1k reposts</div></div></div>
        <div class="page s-feature card" onclick="set({scene:'reader',spread:0})"><img src="${P('mic')}"><div class="kicker">Audio · Import AI</div><h3>Speech-to-text that never leaves the phone</h3><p>A new open model, smaller than Whisper small, matches it on the authors' benchmark — and could take over Soma's offline voice.</p><div class="meta" style="margin-top:8px">Newsletter · 6 min</div></div>
      </div>
      <div class="s-head"><h4>Elsewhere</h4></div>
      <div class="spread">
        <div class="page s-photo" onclick="set({scene:'reader',spread:0})"><img src="${P('harbor')}"><div class="cap">The harbor at golden hour, from the 30th floor. <span class="meta">Bluesky · @dev_one</span></div></div>
        <div class="page"><div class="tops"><h5>In brief</h5></div><div class="briefs" style="padding:0">
          <div class="brief"><span class="t">Tailscale ships per-device names for shared nodes</span><img src="${P('neon')}"></div>
          <div class="brief"><span class="t">Samsung's next cover screen leaks, taller and brighter</span><img src="${P('fold')}"></div>
          <div class="brief"><span class="t">Why magazines on trains are back in Tokyo</span><img src="${P('train')}"></div>
          <div class="brief"><span class="t">The ramen counter you saved gets its first long review</span><img src="${P('ramen')}"></div>
        </div></div>
      </div>
      <div class="end meta">You're caught up · it checks again every hour · pull or tap ↻ any time</div>
    </div>`;
}

function stream() {
  if (S.layout !== 'cover') return streamWide();
  const pair = (a, b) => `<div class="pair">${[a, b].map(c => `<div class="card" onclick="set({scene:'reader',spread:0})"><img src="${P(c[0])}"><div class="kicker">${c[1]}</div><h3>${c[2]}</h3><p>${c[3]}</p><div class="meta">${c[4]}</div></div>`).join('')}</div>`;
  return `<div class="mast"><span class="name">SOMA</span>
      <span class="refresh ${S.refreshing ? 'spin' : ''}"><span class="meta">${S.refreshing ? 'Updating…' : 'Updated ' + S.updated + ' · hourly'}</span><button class="ic" onclick="refresh()" title="Refresh">↻</button></span></div>
    <div class="scroll" id="scroll">
      ${S.fresh ? `<div class="newpill" onclick="set({fresh:0});document.getElementById('scroll').scrollTop=0">↑ ${S.fresh} new stories</div>` : ''}
      <div class="cover-story" onclick="set({scene:'reader',spread:0})">
        <img src="${P('server')}">
        <div class="over"><div class="kicker">Self-hosting · tailscale.com and 4 more</div>
          <h1>The case for reading the web on your own server again</h1>
          <p>RSS never left. FreshRSS on your tailnet brings back the habit — and gives your agents something to read.</p></div>
      </div>
      <div class="section"><h4>Devices</h4></div>
      ${pair(['fold', 'Foldables', 'Foldable launchers are having a moment', 'Three developers you follow shared home screens built like notebooks.', 'X · @foldfan · 2h'],
             ['desk', 'Tools', 'Agents that build on the phone itself', 'A new wave of setups runs the builder where the code is written.', 'Hacker News · 4h'])}
      <div class="quote" onclick="toast('Opens the post on X')"><div class="mark">“</div>
        <blockquote>The home screen should be a notebook, not a grid of apps.</blockquote>
        <div class="who"><span class="av">T</span><span><b>@typecraft_dev</b><div class="meta">From your Android list · 2.1k reposts</div></span></div></div>
      <div class="feature wide" onclick="set({scene:'reader',spread:0})"><img src="${P('mic')}"><div><div class="kicker">Audio · Import AI</div>
        <h3>Speech-to-text that never leaves the phone</h3><p>A new open model, smaller than Whisper small, matches it on the authors' benchmark. It could take over Soma's offline voice.</p><div class="meta" style="margin-top:8px">Newsletter · 6 min</div></div></div>
      <div class="section"><h4>In brief</h4></div>
      <div class="briefs">
        <div class="brief"><span class="t">Tailscale ships per-device names for shared nodes</span><img src="${P('neon')}"></div>
        <div class="brief"><span class="t">Samsung's next cover screen leaks, taller and brighter</span><img src="${P('fold')}"></div>
        <div class="brief"><span class="t">Why magazines on trains are back in Tokyo</span><img src="${P('train')}"></div>
      </div>
      <div class="photo" onclick="set({scene:'reader',spread:0})"><img src="${P('ramen')}"><div class="cap">The Chinatown ramen counter you saved gets its first long review — 14 minutes, mostly about the broth. <span class="meta">YouTube · Food Ranger</span></div></div>
      ${pair(['harbor', 'Honolulu', 'The harbor at golden hour, from the 30th floor', 'A photo essay from someone two buildings over.', 'Bluesky · @dev_one · 1d'],
             ['neon', 'Cities', 'Rain, neon and the return of the night walk', 'Why people are leaving their phones in their pockets after dark.', 'The Verge · 1d'])}
      <div class="end meta">You're caught up · it checks again every hour · pull or tap ↻ any time</div>
    </div>`;
}

const ARTICLE = {
  hero: 'server', kicker: 'Self-hosting · tailscale.com', title: 'The case for reading the web on your own server again',
  dek: 'RSS never left. FreshRSS on your tailnet brings back the habit — and gives your agents something to read.',
  paras: [
    'The feeds are still there on most of the sites you read. What went away was the habit, and the readers that made it a pleasure instead of a chore.',
    'FreshRSS brings both back. It fetches every feed you add on a schedule, keeps what it finds, and hands it to any reader app that speaks the Google Reader API.',
    'Run it in a container next to a Tailscale sidecar and it gets a name on your tailnet: no ports opened, nothing on the public internet, reachable from every device you own.',
  ],
  quote: 'A reader that knows what you care about, without an algorithm deciding for you.',
  figure: ['desk', 'The setup takes a compose file, an auth key and two passwords.'],
  more: [
    'Turn on the API in the settings, give it its own password, and point any reader at it. Agents can use the same API to read what came in and write you a digest.',
    'That is the interesting part: the five sites covering the same story merged into one, and a line on why it matters to you, chosen from what you read and save.',
  ],
};

function reader() {
  const a = ARTICLE;
  if (S.layout === 'portrait') {
    const it = (img, kick, h, on) => `<div class="top-item ${on ? 'on' : ''}" onclick="toast('Opens on the right page')"><div><div class="kicker">${kick}</div><h3 style="font-size:15px">${h}</h3></div><img src="${P(img)}" style="height:70px"></div>`;
    return `<div class="rbar"><button onclick="set({scene:'stream'})" style="font-size:20px">‹</button><span class="name" style="font-family:'M Display';font-size:18px;flex:1">SOMA</span><span class="meta">tailscale.com · 6 min</span><button onclick="toast('Saved to Notes')" style="font-size:18px;margin-left:10px">☆</button></div>
      <div class="split"><div class="list">
        ${it('server', 'Self-hosting', a.title, true)}${it('fold', 'Foldables', 'Foldable launchers are having a moment')}${it('mic', 'Audio', 'Speech-to-text that never leaves the phone')}${it('desk', 'Tools', 'Agents that build on the phone itself')}${it('ramen', 'Food', 'The Chinatown ramen counter you saved, reviewed')}${it('harbor', 'Honolulu', 'The harbor at golden hour')}
      </div><div class="art"><div class="reader"><img class="hero" src="${P(a.hero)}"><div class="body"><div class="kicker">${a.kicker}</div><h1 style="font-size:26px">${a.title}</h1><p class="dek">${a.dek}</p>
        ${a.paras.map((p, i) => `<p class="${i ? '' : 'first'}">${p}</p>`).join('')}<blockquote>${a.quote}</blockquote><figure><img src="${P(a.figure[0])}"><figcaption>${a.figure[1]}</figcaption></figure>${a.more.map(p => `<p>${p}</p>`).join('')}</div></div>
        <div class="tools" style="position:sticky;bottom:14px;left:auto;right:auto;margin:0 12px"><button onclick="toast('Saved to Notes')">→ Notes</button><button onclick="toast('Sent to the Mac Pro')">→ Mac</button><button onclick="toast('Opens the original')">Original</button><button onclick="toast('Reading it to you')">▶ Listen</button></div></div></div>`;
  }
  const bar = `<div class="rbar"><button onclick="set({scene:'stream'})" style="font-size:20px">‹</button><span class="meta" style="flex:1">tailscale.com · 6 min · 5 sources</span><button onclick="toast('Saved to Notes')" style="font-size:18px">☆</button></div>`;
  if (S.layout === 'landscape') {
    return bar + `<div class="book" id="book"><div class="flow" id="flow"><img src="${P(a.hero)}"><div class="kicker">${a.kicker}</div><h1>${a.title}</h1><p><i>${a.dek}</i></p>${a.paras.map(p => `<p>${p}</p>`).join('')}<blockquote>${a.quote}</blockquote><img src="${P(a.figure[0])}">${a.more.map(p => `<p>${p}</p>`).join('')}</div>
      <div class="turn l" onclick="turn(-1)"></div><div class="turn r" onclick="turn(1)"></div></div><div class="folio meta"><span id="fl"></span><span id="fr"></span></div>`;
  }
  return bar + `<div class="scroll"><div class="reader"><img class="hero" src="${P(a.hero)}"><div class="body"><div class="kicker">${a.kicker}</div><h1>${a.title}</h1><p class="dek">${a.dek}</p>
      ${a.paras.map((p, i) => `<p class="${i ? '' : 'first'}">${p}</p>`).join('')}<blockquote>${a.quote}</blockquote>
      <figure><img src="${P(a.figure[0])}"><figcaption>${a.figure[1]}</figcaption></figure>${a.more.map(p => `<p>${p}</p>`).join('')}</div></div></div>
    <div class="tools"><button onclick="toast('Saved to Notes')">→ Notes</button><button onclick="toast('Sent to the Mac Pro')">→ Mac</button><button onclick="toast('Opens the original')">Original</button><button onclick="toast('Reading it to you')">▶ Listen</button></div>`;
}

function widgets() {
  const small = `<div class="w s" onclick="set({scene:'stream'})"><img src="${P('server')}"><span class="wfoot">S</span><div class="over"><div class="kicker">Self-hosting</div><h3>The case for reading the web on your own server</h3></div></div>`;
  const medium = `<div class="w m" onclick="set({scene:'stream'})"><img src="${P('fold')}"><span class="wfoot">M</span><div class="txt"><div class="kicker">Foldables</div><h3>Foldable launchers are having a moment</h3><div class="next">Speech-to-text that never leaves the phone</div><div class="meta">12 new · 12:31</div></div></div>`;
  const large = `<div class="w l" onclick="set({scene:'stream'})"><div class="lead"><img src="${P('server')}"><span class="wfoot">L</span><div class="over"><div class="kicker">Self-hosting · 5 sources</div><h3>The case for reading the web on your own server again</h3></div></div>
      <div class="rows">${[['fold', 'Foldable launchers are having a moment'], ['mic', 'Speech-to-text that never leaves the phone'], ['ramen', 'The Chinatown ramen counter you saved gets a review']].map(r => `<div class="row"><img src="${P(r[0])}"><span>${r[1]}</span></div>`).join('')}</div></div>`;
  return `<div class="home"><div class="grid4">
      <div class="label meta">Small · 2 × 2</div>${small}${small.replace('server', 'ramen').replace('Self-hosting', 'Food').replace('The case for reading the web on your own server', 'The ramen counter you saved, reviewed')}
      <div class="label meta">Medium · 4 × 2</div>${medium}
      <div class="label meta">Large · 4 × 4</div>${large}
    </div></div>`;
}

function turn(d) { S.spread = Math.max(0, Math.min(S.spread + d, spreads() - 1)); place(); }
function spreads() { const b = $('book'), f = $('flow'); return Math.max(1, Math.ceil(f.scrollWidth / (b.clientWidth + 52))); }
function place() {
  const b = $('book'), f = $('flow'); if (!b) return;
  const w = b.clientWidth;
  f.style.columnWidth = ((w - 52) / 2) + 'px'; f.style.columnGap = '52px';
  f.style.transform = `translateX(${-S.spread * (w + 52)}px)`;
  $('fl').textContent = `page ${S.spread * 2 + 1}`; $('fr').textContent = `${S.spread * 2 + 2} of ${spreads() * 2}`;
}

function render() {
  const p = $('phone');
  const keep = $('scroll') ? $('scroll').scrollTop : 0;
  p.className = 'phone ' + S.layout;
  p.innerHTML = ({ stream, reader, widgets })[S.scene]() + (S.toast ? `<div class="toast">${S.toast}</div>` : '');
  if ($('scroll') && S.scene === 'stream') $('scroll').scrollTop = keep;
  if ($('book')) { place(); p.querySelectorAll('.flow img').forEach(i => i.onload = place); }
  $('layouts').innerHTML = LAYOUTS.map(([k, l]) => `<button class="${S.layout === k ? 'on' : ''}" onclick="set({layout:'${k}',spread:0})">${l}</button>`).join('');
  $('scenes').innerHTML = SCENES.map(([k, l]) => `<button class="${S.scene === k ? 'on' : ''}" onclick="set({scene:'${k}',spread:0})">${l}</button>`).join('');
  const top = document.querySelector('.top').offsetHeight + 8;
  $('stage').style.top = top + 'px';
  const w = p.offsetWidth, h = p.offsetHeight;
  const s = Math.min((innerWidth - 12) / w, (innerHeight - top - 8) / h, 1.6);
  const sc = $('scaler'); sc.style.width = w * s + 'px'; sc.style.height = h * s + 'px';
  p.style.transform = `scale(${s})`;
}
addEventListener('resize', render);
render();
document.fonts && document.fonts.ready.then(render);
</script>
</body>
</html>
