// The throwaway second launcher, "Oma Dev": the same source built under its own package, so it installs
// beside the working launcher with its own data and can be broken, replaced and removed without touching it.
// Used by oma-dev only. The working launcher's own configuration is the private fold.init.gradle.
allprojects { p ->
    p.plugins.withId('com.android.application') {
        p.androidComponents.finalizeDsl { android ->
            android.ndkVersion = '29.0.14206865'
            android.buildToolsVersion = '36.0.0'
            android.buildTypes.debug.applicationIdSuffix = '.dev'
            // Every entry it puts in the app list says Dev, and its icon is magenta, so it is never taken for the working launcher.
            android.buildTypes.debug.manifestPlaceholders['appLabel'] = 'Soma Dev'
            android.buildTypes.debug.manifestPlaceholders['labelSuffix'] = ' Dev'
            android.sourceSets.debug.res.srcDir(new File(p.rootDir, 'tools/fold-development/dev-res'))
            android.signingConfigs.debug.storeFile = new File('/root/.config/oma-development/working-debug.keystore')
            android.signingConfigs.debug.storePassword = 'android'
            android.signingConfigs.debug.keyAlias = 'androiddebugkey'
            android.signingConfigs.debug.keyPassword = 'android'
        }
    }
}
