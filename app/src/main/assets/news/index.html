<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soma News</title>
<!--
  Soma News (Boss, 2026-10-21; the approved mock-up is design/soma-news-mockup.html). The stream set as a magazine
  from Google News (top stories and its topics; FreshRSS on the Mac Pro before 2026-10-22): a cover story, pairs, features, briefs and photo essays on the cover;
  spreads either side of the fold on the open Fold. The reader scrolls on the cover and the open Fold upright (with
  the stream kept on the left page there), and turns pages, laid out by Pretext, held sideways (news-book.js).
  Stories come from the app (window.SomaNews); nothing here is sample text.
-->
<style>
  @font-face { font-family: "M Display"; src: url(../packs/manga/fonts/DelaGothicOne-Regular.ttf); }
  @font-face { font-family: "M Body"; src: url(../packs/manga/fonts/SchibstedGrotesk.ttf); }
  @font-face { font-family: "M Mono"; src: url(../packs/manga/fonts/JetBrainsMono.ttf); }
  :root { --paper: #fbfaf6; --ink: #111113; --muted: #74737a; --red: #d7262d; --rule: #d9d6cf; --serif: "Noto Serif", Georgia, "Times New Roman", serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font: 15px/1.45 "M Body", system-ui, sans-serif; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  img { display: block; width: 100%; object-fit: cover; background: #e9e6df; }
  .kicker { font: 600 10.5px/1.2 "M Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--red); }
  .meta { font: 10.5px/1.3 "M Mono", monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  .scroll { flex: 1; overflow-y: auto; scrollbar-width: none; position: relative; -webkit-overflow-scrolling: touch; }
  .scroll::-webkit-scrollbar { display: none; }
  /* Keep the outer panes vertical. Long words and URLs wrap, and grid/flex
     children may shrink below their longest word instead of widening the page. */
  .scroll, .split .list, .split .art { overflow-x: hidden; }
  .pair > *, .feature > *, .duo > *, .top-item > *, .brief .t { min-width: 0; }
  h1, h3, .card p, .feature p, .brief .t, .kicker, .meta, .cap, .reader .body { overflow-wrap: anywhere; }

  .mast { padding: calc(env(safe-area-inset-top) + 14px) 18px 10px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--ink); background: var(--paper); }
  .mast .name { font-family: "M Display"; font-size: 22px; flex: 1; }
  .refresh { display: flex; align-items: center; gap: 8px; }
  .refresh .ic { width: 36px; height: 36px; border: 1.3px solid var(--ink); border-radius: 50%; display: grid; place-items: center; font-size: 18px; }
  .refresh.spin .ic { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .newpill { position: sticky; top: 10px; margin: 0 auto -34px; width: max-content; background: var(--ink); color: var(--paper); padding: 7px 14px; border-radius: 18px; font-size: 13px; z-index: 6; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  .empty { padding: 60px 30px; text-align: center; color: var(--muted); font-family: var(--serif); font-size: 17px; }

  /* The cover screen: a magazine's run of layouts. */
  .cover-story { position: relative; color: #fff; }
  .cover-story img { height: 440px; }
  .cover-story .over { position: absolute; left: 0; right: 0; bottom: 0; padding: 80px 20px 20px; background: linear-gradient(transparent, rgba(0,0,0,.84)); }
  .cover-story .kicker { color: #ffd166; }
  .cover-story h1 { font-family: var(--serif); font-weight: 700; font-size: 29px; line-height: 1.12; margin: 8px 0 0; }
  /* Google News topics (Boss, 2026-10-22): a row of chips to jump, five a topic, Show more for the rest. */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 18px; border-bottom: 1px solid var(--rule); scrollbar-width: none; background: var(--paper); }
  .chips button { flex: none; font: 600 12px "M Mono"; letter-spacing: .08em; text-transform: uppercase; padding: 7px 12px; border: 1.5px solid var(--ink); border-radius: 16px; }
  .topic { scroll-margin-top: 8px; }
  .topic .section .count { font: 11px "M Mono"; color: var(--muted); }
  .more { display: block; margin: 6px 18px 4px; padding: 10px; width: calc(100% - 36px); border: 1.5px solid var(--ink); font: 600 12.5px "M Mono"; letter-spacing: .1em; text-transform: uppercase; text-align: center; }
  .spread .more { width: 100%; margin: 10px 0 0; }
  .section { padding: 24px 18px 6px; display: flex; align-items: baseline; gap: 10px; }
  .section h4 { margin: 0; font: 700 12.5px "M Mono"; letter-spacing: .14em; text-transform: uppercase; }
  .section::after { content: ""; flex: 1; border-top: 1px solid var(--ink); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 10px 18px 6px; }
  .card img { height: 140px; margin-bottom: 8px; }
  .card h3 { font-family: var(--serif); font-size: 16.5px; line-height: 1.22; margin: 6px 0 4px; }
  .card .meta { margin-top: 6px; }
  .feature { display: grid; grid-template-columns: 42% 1fr; gap: 14px; padding: 16px 18px 6px; align-items: start; }
  .feature img { height: 160px; }
  .feature h3 { font-family: var(--serif); font-size: 19px; line-height: 1.2; margin: 6px 0 6px; }
  .feature p, .card p { margin: 0; font-family: var(--serif); color: #444; font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .briefs { padding: 6px 18px 4px; counter-reset: b; }
  .brief { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--rule); align-items: center; }
  .brief::before { counter-increment: b; content: counter(b); font-family: "M Display"; font-size: 22px; color: var(--red); width: 24px; flex: none; }
  .brief .t { flex: 1; font-family: var(--serif); font-size: 15.5px; line-height: 1.3; }
  .brief .t .meta { display: block; margin-top: 3px; }
  .brief img { width: 58px; height: 58px; flex: none; }
  .photo { margin: 18px 0 6px; }
  .photo img { height: 290px; }
  .photo .cap { padding: 8px 18px 0; font-family: var(--serif); font-style: italic; color: #333; font-size: 14.5px; }
  .end { padding: 26px 18px 60px; text-align: center; }

  /* The open Fold: spreads either side of the fold, nothing across the crease. */
  .spread { display: grid; grid-template-columns: 1fr 1fr; column-gap: 36px; padding: 0 22px; position: relative; }
  .spread::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: linear-gradient(transparent, var(--rule) 12%, var(--rule) 88%, transparent); }
  .spread + .spread { margin-top: 26px; }
  .page { min-width: 0; }
  .s-cover { position: relative; color: #fff; min-height: 520px; }
  .s-cover img { position: absolute; inset: 0; height: 100%; }
  .s-cover .over { position: absolute; inset: auto 0 0 0; padding: 90px 20px 22px; background: linear-gradient(transparent, rgba(0,0,0,.85)); }
  .s-cover .kicker { color: #ffd166; }
  .s-cover h1 { font-family: var(--serif); font-size: 30px; line-height: 1.1; margin: 10px 0 0; }
  .tops h5 { margin: 0 0 6px; font: 700 12px "M Mono"; letter-spacing: .14em; text-transform: uppercase; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
  .top-item { display: grid; grid-template-columns: 1fr 92px; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
  .top-item.noimg { grid-template-columns: 1fr; }
  .top-item img { height: 92px; }
  .top-item h3 { font-family: var(--serif); font-size: 16.5px; line-height: 1.22; margin: 5px 0 4px; }
  .s-head { padding: 26px 22px 10px; display: flex; align-items: baseline; gap: 12px; }
  .s-head h4 { margin: 0; font-family: "M Display"; font-size: 21px; font-weight: normal; }
  .s-head::after { content: ""; flex: 1; border-top: 1px solid var(--ink); }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .duo .card img { height: 128px; }
  .s-feature img { height: 230px; margin-bottom: 10px; }
  .s-feature h3 { font-family: var(--serif); font-size: 21px; line-height: 1.16; margin: 6px 0 6px; }
  .s-feature .words h3 { font-size: 34px; line-height: 1.08; margin: 10px 0 12px; }
  .s-photo img { height: 360px; }
  .s-photo .cap { padding-top: 8px; font-family: var(--serif); font-style: italic; color: #333; font-size: 14.5px; }

  /* The reader. */
  .rbar { padding: calc(env(safe-area-inset-top) + 10px) 14px 10px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--ink); background: var(--paper); }
  .rbar .back { font-size: 24px; padding: 0 8px 2px 0; }
  .reader { padding-bottom: 90px; }
  .reader .hero { max-height: 340px; }
  .reader .body { padding: 18px 22px 0; font-family: var(--serif); font-size: 18px; line-height: 1.62; max-width: 680px; margin: 0 auto; }
  .reader h1 { font-family: var(--serif); font-weight: 700; font-size: 28px; line-height: 1.14; margin: 10px 0 8px; }
  .reader .body p { margin: 0 0 16px; }
  /* The drop capital three lines deep, sized and set by the browser to the lines (Boss, 2026-10-21: "the spacing is off"). */
  .reader .body .first::first-letter { initial-letter: 3; -webkit-initial-letter: 3; font-family: "M Display"; color: var(--red); margin-right: .14em; }
  @supports not ((initial-letter: 3) or (-webkit-initial-letter: 3)) {
    .reader .body .first::first-letter { float: left; font-size: 4.1em; line-height: .8; margin: .06em .12em 0 0; }
  }
  .reader .body blockquote { margin: 22px 0; padding: 2px 0 2px 16px; border-left: 4px solid var(--red); font-size: 20px; font-style: italic; line-height: 1.4; }
  .reader .body blockquote p:last-child { margin-bottom: 0; }
  /* Pictures stand on their own lines, full column width at most; never beside a line of text. */
  .reader .body img { display: block; width: auto; max-width: 100%; height: auto; margin: 22px auto; border-radius: 2px; }
  .reader .body p > img:only-child, .reader .body a > img:only-child { margin: 6px auto; }
  .reader .body figure { margin: 24px 0; padding: 0; }
  .reader .body figure img { margin: 0 auto 8px; }
  .reader .body figcaption { font-size: 13.5px; line-height: 1.45; color: var(--muted); font-style: italic; }
  .reader .body img.icon { display: inline; height: 1em; width: auto; margin: 0 .15em; vertical-align: -.12em; }
  .reader .body a { color: var(--ink); text-decoration-color: var(--red); overflow-wrap: anywhere; }
  .reader .body h2, .reader .body h3, .reader .body h4 { font-size: 21px; line-height: 1.25; margin: 30px 0 10px; }
  .reader .body ul, .reader .body ol { padding-left: 24px; margin: 0 0 16px; }
  .reader .body li { margin-bottom: 6px; }
  .reader .body pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; line-height: 1.5; background: #efece4; padding: 12px 14px; margin: 0 0 16px; }
  .reader .body code { font-size: .86em; overflow-wrap: anywhere; }
  .reader .body table { display: block; overflow-x: auto; border-collapse: collapse; font-size: 15px; margin: 0 0 16px; }
  .reader .body td, .reader .body th { border-bottom: 1px solid var(--rule); padding: 6px 10px 6px 0; vertical-align: top; }
  .reader .body hr { border: 0; border-top: 1px solid var(--rule); margin: 26px 0; }
  .reader .body > :last-child { margin-bottom: 0; }
  .reader .orig { margin: 28px 22px 0; padding: 12px; border: 1.5px solid var(--ink); text-align: center; font-family: var(--serif); font-size: 15px; }
  .reader .fetching { color: var(--muted); font-family: "M Mono"; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin: 6px 0 18px; }
  .tools { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 14px); display: flex; justify-content: space-around; border: 1.5px solid var(--ink); background: var(--paper); padding: 6px; box-shadow: 4px 4px 0 var(--ink); z-index: 5; max-width: 520px; margin: 0 auto; }
  .tools button { font-size: 13.5px; padding: 7px 10px; }
  .split { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  .split .list { overflow-y: auto; border-right: 1px solid var(--rule); padding: 6px 16px 30px; scrollbar-width: none; }
  .split .list .top-item.on { background: #fff3c4; margin: 0 -10px; padding: 12px 10px; }
  .split .art { overflow-y: auto; scrollbar-width: none; position: relative; }
  .split .tools { position: sticky; bottom: 14px; margin: 0 12px; left: auto; right: auto; }
  #bookwrap { flex: 1; display: flex; min-height: 0; }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 9px 14px; font-size: 13px; z-index: 60; max-width: 86vw; text-align: center; }
</style>
<script src="vendor/readability/Readability.js"></script>
<script src="news-content.js"></script>
<script src="vendor/hyphen/hyphen.js"></script>
<script src="vendor/hyphen/en-us.js"></script>
</head>
<body>
<div id="app"></div>
<script>
const Native = window.SomaNews || { stream: () => '{"stories":[]}', refresh() {}, original(u) { window.open(u) }, share() {}, toast() {}, page() {}, full: () => '', keep() {} };
const S = { stories: [], updated: 0, scene: 'stream', at: -1, refreshing: false, fresh: 0, toast: '', full: {}, streamTop: 0 };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function layout() { return innerWidth < 600 ? 'cover' : innerWidth > innerHeight ? 'landscape' : 'portrait'; }

function load() {
  try { const d = JSON.parse(Native.stream()); S.stories = d.stories || []; S.updated = d.updated || 0; } catch (e) { S.stories = []; }
  S.pending = null;
}

function ago(t) {
  const s = Date.now() / 1000 - t;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + 'm';
  if (s < 86400) return Math.round(s / 3600) + 'h';
  return Math.round(s / 86400) + 'd';
}
function clock(t) { const d = new Date(t * 1000); return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
function day(t) {
  const d = new Date(t * 1000), now = new Date();
  const days = Math.floor((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
  return days <= 0 ? 'Today' : days === 1 ? 'Yesterday' : d.toLocaleDateString([], { weekday: 'long' });
}
function text(html) { const d = document.createElement('div'); d.innerHTML = html || ''; return (d.textContent || '').replace(/\s+/g, ' ').trim(); }
function dek(s, n = 150) { const t = NewsContent.isHeadline(text(s.html), s) ? '' : text(s.html); return t.length > n ? t.slice(0, n).replace(/\s\S*$/, '') + '…' : t; }
function idx(s) { return S.stories.indexOf(s); }
const open = i => `onclick="openStory(${i})"`;

// ---- The stream, planned from what came in: stories with a picture make the big layouts, the rest the briefs. ----
function plan() {
  const pics = S.stories.filter(s => s.image), plain = S.stories.filter(s => !s.image);
  const take = (from, n) => from.splice(0, n);
  const out = [];
  if (pics.length) out.push({ k: 'cover', s: take(pics, 1) });
  while (pics.length || plain.length) {
    const head = (pics[0] || plain[0]);
    out.push({ k: 'section', label: head ? day(head.published) : '' });
    if (pics.length >= 2) out.push({ k: 'pair', s: take(pics, 2) });
    if (pics.length) out.push({ k: 'feature', s: take(pics, 1) });
    const b = take(plain, 4); if (b.length < 3) b.push(...take(pics, 3 - b.length));
    if (b.length) out.push({ k: 'briefs', s: b });
    if (pics.length) out.push({ k: 'photo', s: take(pics, 1) });
  }
  // One section head per day, not per run.
  let last = null;
  return out.filter(b => b.k !== 'section' || (b.label !== last && (last = b.label, true)));
}

function mast() {
  return `<div class="mast"><span class="name">SOMA</span>
    <span class="refresh ${S.refreshing ? 'spin' : ''}"><span class="meta">${S.refreshing ? 'Updating…' : S.updated ? 'Updated ' + clock(S.updated) + ' · hourly' : 'Not updated yet'}</span><button class="ic" onclick="refresh()" aria-label="Refresh">↻</button></span></div>`;
}

function card(s) {
  return `<div class="card" ${open(idx(s))}>${s.image ? `<img src="${esc(s.image)}" loading="lazy" onerror="this.removeAttribute('src')">` : ''}<div class="kicker">${esc(s.source)}</div><h3>${esc(s.title)}</h3><p>${esc(dek(s))}</p><div class="meta">${ago(s.published)} ago</div></div>`;
}

function streamCover() {
  const blocks = plan().map(b => {
    const s = b.s && b.s[0];
    switch (b.k) {
      case 'cover': return `<div class="cover-story" ${open(idx(s))}><img src="${esc(s.image)}" onerror="this.style.visibility='hidden'"><div class="over"><div class="kicker">${esc(s.source)} · ${ago(s.published)}</div><h1>${esc(s.title)}</h1></div></div>`;
      case 'section': return `<div class="section"><h4>${esc(b.label)}</h4></div>`;
      case 'pair': return `<div class="pair">${b.s.map(card).join('')}</div>`;
      case 'feature': return `<div class="feature" ${open(idx(s))}><img src="${esc(s.image)}" loading="lazy" onerror="this.removeAttribute('src')"><div><div class="kicker">${esc(s.source)}</div><h3>${esc(s.title)}</h3><p>${esc(dek(s, 200))}</p><div class="meta" style="margin-top:8px">${ago(s.published)} ago</div></div></div>`;
      case 'briefs': return `<div class="briefs">${b.s.map(x => `<div class="brief" ${open(idx(x))}><span class="t">${esc(x.title)}<span class="meta">${esc(x.source)} · ${ago(x.published)}</span></span>${x.image ? `<img src="${esc(x.image)}" loading="lazy" onerror="this.removeAttribute('src')">` : ''}</div>`).join('')}</div>`;
      case 'photo': return `<div class="photo" ${open(idx(s))}><img src="${esc(s.image)}" loading="lazy" onerror="this.removeAttribute('src')"><div class="cap">${esc(s.title)} <span class="meta">${esc(s.source)}</span></div></div>`;
    }
  }).join('');
  return blocks;
}

function topItem(s, on) {
  return `<div class="top-item ${s.image ? '' : 'noimg'} ${on ? 'on' : ''}" ${open(idx(s))}><div><div class="kicker">${esc(s.source)}</div><h3>${esc(s.title)}</h3><div class="meta">${ago(s.published)} ago</div></div>${s.image ? `<img src="${esc(s.image)}" loading="lazy" onerror="this.removeAttribute('src')">` : ''}</div>`;
}

function streamWide() {
  const pics = S.stories.filter(s => s.image), plain = S.stories.filter(s => !s.image);
  const take = (from, n) => from.splice(0, n);
  let html = '';
  const cover = take(pics, 1)[0];
  const tops = [...take(plain, 2), ...take(pics, 2)].sort((a, b) => b.published - a.published);
  if (cover) html += `<div class="spread"><div class="page s-cover" ${open(idx(cover))}><img src="${esc(cover.image)}"><div class="over"><div class="kicker">${esc(cover.source)} · ${ago(cover.published)}</div><h1>${esc(cover.title)}</h1></div></div><div class="page tops"><h5>Top stories</h5>${tops.map(s => topItem(s)).join('')}</div></div>`;
  let last = null;
  while (pics.length || plain.length) {
    const head = pics[0] || plain[0];
    const label = day(head.published);
    if (label !== last) { html += `<div class="s-head"><h4>${esc(label)}</h4></div>`; last = label; }
    if (pics.length >= 4) html += `<div class="spread"><div class="page duo">${take(pics, 2).map(card).join('')}</div><div class="page duo">${take(pics, 2).map(card).join('')}</div></div>`;
    const f = take(pics, 1)[0];
    const b = take(plain, 5); if (b.length < 3) b.push(...take(pics, 3 - b.length));
    if (f || b.length) html += `<div class="spread" style="margin-top:26px"><div class="page ${f ? 's-feature' : ''}">${f ? `<div class="card" ${open(idx(f))}><img src="${esc(f.image)}" loading="lazy"><div class="kicker">${esc(f.source)}</div><h3>${esc(f.title)}</h3><p>${esc(dek(f, 240))}</p><div class="meta" style="margin-top:8px">${ago(f.published)} ago</div></div>` : ''}</div><div class="page"><div class="tops"><h5>In brief</h5></div><div class="briefs" style="padding:0">${b.map(x => `<div class="brief" ${open(idx(x))}><span class="t">${esc(x.title)}<span class="meta">${esc(x.source)} · ${ago(x.published)}</span></span>${x.image ? `<img src="${esc(x.image)}" loading="lazy" onerror="this.removeAttribute('src')">` : ''}</div>`).join('')}</div></div></div>`;
    const p = take(pics, 1)[0];
    if (p) html += `<div class="spread" style="margin-top:26px"><div class="page s-photo" ${open(idx(p))}><img src="${esc(p.image)}" loading="lazy"><div class="cap">${esc(p.title)} <span class="meta">${esc(p.source)}</span></div></div><div class="page tops"><h5>More</h5>${[...take(plain, 3), ...take(pics, 1)].map(s => topItem(s)).join('')}</div></div>`;
  }
  return html;
}

// ---- Google News topics: top stories, then five a topic with Show more. ----
S.more = {};
const TOPICS = ['Top stories', 'U.S.', 'World', 'Business', 'Technology', 'Science', 'Health', 'Entertainment', 'Sports'];
const SHOWN = 5;
function topics() {
  const by = {};
  for (const s of S.stories) (by[s.topic] = by[s.topic] || []).push(s);
  return TOPICS.filter(t => by[t] && by[t].length).map(t => ({ name: t, all: by[t] }));
}
const topicId = t => 'topic-' + t.replace(/[^a-z]/gi, '').toLowerCase();
function chips(list) {
  return `<div class="chips" role="tablist">${list.map(t => `<button onclick="jump('${topicId(t.name)}')">${esc(t.name)}</button>`).join('')}</div>`;
}
window.jump = id => { const el = $(id), sc = $('scroll'); if (el && sc) sc.scrollTo({ top: el.offsetTop - sc.offsetTop, behavior: 'smooth' }); };
// Show more / Show less never throws him elsewhere: the stream is drawn anew, so its scroll is set again, once at once
// and once after the next layout (set only at once, the 2c50cef5 walk landed near the top of Top stories). Opening keeps
// the stream where it was, the new stories following below; closing keeps the button where his finger was.
window.toggleMore = name => {
  const button = () => document.querySelector(`#${topicId(name)} .more`);
  const was = button() ? button().getBoundingClientRect().top : null;
  const sc = $('scroll'), at = sc ? sc.scrollTop : 0;
  S.more[name] = !S.more[name]; draw();
  const place = () => {
    const sc = $('scroll'), b = button();
    if (!sc) return;
    // Opening: the stream stays where it was and the new stories follow on below. Closing: the button stays put.
    if (S.more[name] || !b || was === null) sc.scrollTop = at; else sc.scrollTop += b.getBoundingClientRect().top - was;
  };
  place(); requestAnimationFrame(() => requestAnimationFrame(place));
};
function moreButton(t) {
  if (t.all.length <= SHOWN) return '';
  return `<button class="more" onclick="toggleMore(${esc(JSON.stringify(t.name))})">${S.more[t.name] ? 'Show less' : `Show ${t.all.length - SHOWN} more`}</button>`;
}
function brief(x) {
  return `<div class="brief" ${open(idx(x))}><span class="t">${esc(x.title)}<span class="meta">${esc(x.source)} · ${ago(x.published)}</span></span>${x.image ? `<img src="${esc(x.image)}" loading="lazy" onerror="this.removeAttribute('src')">` : ''}</div>`;
}
function topicCover(t, first) {
  const shown = S.more[t.name] ? t.all : t.all.slice(0, SHOWN);
  const lead = shown.find(s => s.image);
  const rest = shown.filter(s => s !== lead);
  let html = `<div class="topic" id="${topicId(t.name)}">`;
  if (first && lead) html += `<div class="cover-story" ${open(idx(lead))}><img src="${esc(lead.image)}" onerror="this.style.visibility='hidden'"><div class="over"><div class="kicker">${esc(lead.source)} · ${ago(lead.published)}</div><h1>${esc(lead.title)}</h1></div></div>`;
  html += `<div class="section"><h4>${esc(t.name)}</h4><span class="count">${t.all.length}</span></div>`;
  if (!first && lead) html += `<div class="feature" ${open(idx(lead))}><img src="${esc(lead.image)}" loading="lazy" onerror="this.removeAttribute('src')"><div><div class="kicker">${esc(lead.source)}</div><h3>${esc(lead.title)}</h3><div class="meta" style="margin-top:8px">${ago(lead.published)} ago</div></div></div>`;
  if (rest.length) html += `<div class="briefs">${rest.map(brief).join('')}</div>`;
  return html + moreButton(t) + `</div>`;
}
function topicWide(t, first) {
  const shown = S.more[t.name] ? t.all : t.all.slice(0, SHOWN);
  const lead = shown.find(s => s.image);
  const rest = shown.filter(s => s !== lead);
  // No picture among them: the first story leads in words, so the left page isn't left empty (the 131 walk, unfolded).
  const words = !lead && shown[0];
  const left = lead
    ? (first ? `<div class="page s-cover" ${open(idx(lead))}><img src="${esc(lead.image)}"><div class="over"><div class="kicker">${esc(lead.source)} · ${ago(lead.published)}</div><h1>${esc(lead.title)}</h1></div></div>`
      : `<div class="page s-feature"><div class="card" ${open(idx(lead))}><img src="${esc(lead.image)}" loading="lazy"><div class="kicker">${esc(lead.source)}</div><h3>${esc(lead.title)}</h3><div class="meta" style="margin-top:8px">${ago(lead.published)} ago</div></div></div>`)
    : words ? `<div class="page s-feature"><div class="card words" ${open(idx(words))}><div class="kicker">${esc(words.source)}</div><h3>${esc(words.title)}</h3><div class="meta">${ago(words.published)} ago</div></div></div>`
    : `<div class="page"></div>`;
  const others = words ? rest.filter(s => s !== words) : rest;
  return `<div class="topic" id="${topicId(t.name)}"><div class="s-head"><h4>${esc(t.name)}</h4></div><div class="spread">${left}<div class="page tops">${others.map(s => topItem(s)).join('')}${moreButton(t)}</div></div></div>`;
}
function streamTopics() {
  const list = topics();
  const one = layout() === 'cover' ? topicCover : topicWide;
  return chips(list) + list.map((t, i) => one(t, i === 0)).join('');
}

function stream() {
  const body = !S.stories.length
    ? `<div class="empty">${S.refreshing ? 'Fetching the news from Google News…' : 'Nothing here yet. Tap ↻ to fetch from Google News.'}</div>`
    : (S.stories.some(s => s.topic) ? streamTopics() : layout() === 'cover' ? streamCover() : streamWide()) + `<div class="end meta">You're caught up · it checks again every hour · tap ↻ any time</div>`;
  // The "new stories" pill comes after the topic chips, so it never sits on them (the 128 walk's screenshots).
  const pill = S.fresh ? `<div class="newpill" onclick="takeNew()">↑ ${S.fresh} new ${S.fresh === 1 ? 'story' : 'stories'}</div>` : '';
  const placed = body.startsWith('<div class="chips"') ? body.replace(/^(<div class="chips"[^]*?<\/div>)/, '$1' + pill) : pill + body;
  return mast() + `<div class="scroll" id="scroll">${placed}</div>`;
}

// ---- The reader. ----

/** A story's HTML, cleaned to what a reader shows: text, pictures, quotes, lists, links, code and tables. */
function clean(html, story) { return NewsContent.article(html, story).innerHTML; }

// ---- Whole articles (Boss, 2026-10-21: "Can we pull the full articles? I don't want to have to leave to the website"). ----
// The app fetches the story's page; Readability (Firefox's reader view) takes the article out of it here, where the
// page is only parsed, never run. What it took is kept on the phone, so a story opens whole at once next time.

/** What the reader shows of [s]: its whole article once it has it, else what the feed gave. */
function bodyOf(s) { const f = S.full[s.link]; return f && f.html ? f.html : s.html; }

function want(s) {
  if (!s || !s.link || S.full[s.link]) return;
  const kept = Native.full(s.link);
  if (kept) { S.full[s.link] = { html: clean(kept, s) }; return; }
  S.full[s.link] = { loading: true };
  Native.page(s.link);
}

window.somaPage = function (link, html) {
  const s = S.stories.find(x => x.link === link);
  let got = '';
  if (html && window.Readability) {
    try {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const base = doc.createElement('base'); base.href = link; doc.head.prepend(base);
      const a = new Readability(doc, { charThreshold: 300, keepClasses: true }).parse();
      // Only when it is more of the story than the feed gave.
      const content = a && a.content ? clean(a.content, s) : '';
      if (text(content).length > Math.max(400, s ? text(s.html).length * 1.15 : 0)) got = content;
    } catch (e) { got = ''; }
  }
  S.full[link] = got ? { html: got } : { failed: true, busy: !html && !!(Native.googleBusy && Native.googleBusy()) };
  if (got) Native.keep(link, got);
  const showing = S.scene === 'reader' && S.stories[S.at] && S.stories[S.at].link === link;
  if (!showing) return;
  const art = $('art'), at = art ? art.scrollTop : 0;
  draw();
  if ($('art')) $('art').scrollTop = at;
};

function readMinutes(s) { return Math.max(1, Math.round(text(bodyOf(s)).split(' ').length / 230)); }

function article(s) {
  const f = S.full[s.link] || {};
  const d = NewsContent.article(bodyOf(s), s);
  // The hero picture isn't shown twice (the page's copy may be another size of it), nor the headline.
  const stem = u => (u || '').split('?')[0].replace(/[-_]\d+x\d+(?=\.\w+$)/, '');
  if (s.image) d.querySelectorAll('img').forEach(im => { if (stem(im.getAttribute('src')) === stem(s.image)) (im.closest('figure') || im).remove(); });
  // The headline as a heading or the only paragraph (Google's feed gives it as the story) NewsContent has taken out.
  // The drop capital opens the first real paragraph: one that starts with a letter, not a caption or a dateline.
  const firstP = [...d.querySelectorAll('p')].find(p => !p.closest('figure, blockquote, li') && p.textContent.trim().length >= 80 && /^[A-Za-z0-9]/.test(p.textContent.trim()));
  if (firstP) firstP.classList.add('first');
  const short = text(bodyOf(s)).length < 600;
  const state = f.loading ? '<div class="fetching">Getting the whole story…</div>' : '';
  const foot = f.html ? `Read it at ${esc(s.source)} ↗` : short && f.busy ? `Google News is holding this network back for a while, so the story couldn't be fetched. Read it at ${esc(s.source)} ↗` : short && f.failed ? `${esc(s.source)} didn't give the whole story here. Read it there ↗` : f.loading ? '' : `Read it at ${esc(s.source)} ↗`;
  return `<div class="reader">${s.image ? `<img class="hero" src="${esc(s.image)}">` : ''}<div class="body"><div class="kicker">${esc(s.source)}</div><h1>${esc(s.title)}</h1><div class="meta" style="margin-bottom:${state ? 6 : 18}px">${ago(s.published)} ago · ${readMinutes(s)} min read</div>${state}<div id="flow">${d.innerHTML}</div></div>
    ${foot ? `<div class="orig" onclick="Native.original(${esc(JSON.stringify(s.link))})">${foot}</div>` : ''}</div>`;
}

function tools(s) {
  return `<div class="tools"><button onclick="Native.share(${esc(JSON.stringify(s.title))}, ${esc(JSON.stringify(s.link))})">Share</button><button onclick="Native.original(${esc(JSON.stringify(s.link))})">Original ↗</button>${S.at + 1 < S.stories.length ? `<button onclick="openStory(S.at + 1)">Next ›</button>` : ''}</div>`;
}

function reader() {
  const s = S.stories[S.at];
  const bar = `<div class="rbar"><button class="back" aria-label="Back to news stream" onclick="somaBack()">‹</button><span class="meta" style="flex:1">${esc(s.source)} · ${readMinutes(s)} min</span></div>`;
  const l = layout();
  if (l === 'landscape') return `<div id="bookwrap"></div>`;
  if (l === 'portrait') {
    const near = S.stories.slice(Math.max(0, S.at - 3), S.at + 12);
    return bar + `<div class="split"><div class="list" id="list">${near.map(x => topItem(x, x === s)).join('')}</div><div class="art" id="art">${article(s)}${tools(s)}</div></div>`;
  }
  return bar + `<div class="scroll" id="art">${article(s)}</div>` + tools(s);
}

/** The story for the turning pages: its text as paragraphs, quotes and pictures (sized once they load). */
async function bookArticle(s) {
  const d = NewsContent.article(bodyOf(s), s);
  const blocks = NewsContent.blocks(d);
  let side = 'right';
  const pics = blocks.filter(b => b.img);
  if (!blocks.some(b => b.p)) blocks.push({ p: dek(s, 2000) || `${s.source || 'The site'} didn't give the whole story here.` });
  // Each picture's shape before the pages are laid out; one that won't load in time, or is tiny, is left out.
  await Promise.all(pics.map(b => new Promise(res => {
    const im = new Image(); let finished = false; const done = ok => { if (finished) return; finished = true; if (ok && im.naturalWidth >= 200) { b.ratio = im.naturalWidth / im.naturalHeight; } else b.drop = true; res(); };
    im.onload = () => done(true); im.onerror = () => done(false); setTimeout(() => done(im.complete && im.naturalWidth > 0), 2500); im.src = b.img;
  })));
  const out = [];
  for (const b of blocks) {
    if (b.img) {
      if (b.drop || !b.ratio) continue;
      if (b.ratio > 1.6) out.push({ img: b.img, full: true, ratio: b.ratio, cap: '' });
      else { out.push({ img: b.img, side, frac: 0.48, ratio: b.ratio, cap: '' }); side = side === 'right' ? 'left' : 'right'; }
    } else out.push(b);
  }
  const next = S.stories[S.at + 1];
  return { hero: s.image, kicker: s.source, title: s.title, dek: dek(s, 160), by: `${s.source} · ${readMinutes(s)} min read · ${ago(s.published)} ago`,
    next: next ? { title: next.title, img: next.image || '' } : null, blocks: out };
}

// ---- Drawing, and what the app and his fingers ask. ----

function draw() {
  const app = $('app');
  if ($('scroll')) S.streamTop = $('scroll').scrollTop;
  app.innerHTML = (S.scene === 'stream' ? stream() : reader()) + (S.toast ? `<div class="toast">${esc(S.toast)}</div>` : '');
  if (S.scene === 'stream' && $('scroll')) $('scroll').scrollTop = S.streamTop;
  if ($('bookwrap')) {
    const el = $('bookwrap'), s = S.stories[S.at];
    Promise.all([document.fonts ? document.fonts.ready : null, import('./news-book.js'), bookArticle(s)]).then(([, m, a]) => { if (el.isConnected && S.stories[S.at] === s) m.mount(el, a); });
  }
  if ($('flow')) {
    // Portrait too: the body set by the book's engine, wrapping round its photos (Boss, 2026-10-21: "I like the text
    // wrapping, it's just we didn't do it properly"). Until it's set, the plain HTML shows.
    const el = $('flow'), s = S.stories[S.at];
    const body = innerWidth < 600 ? { size: 17.5, lh: 28 } : { size: 18, lh: 29 };
    Promise.all([document.fonts ? document.fonts.ready : null, import('./news-book.js'), bookArticle(s)]).then(([, m, a]) => { if (el.isConnected && S.stories[S.at] === s) m.flow(el, a, body); });
  }
  if ($('list')) { const on = $('list').querySelector('.on'); on && on.scrollIntoView({ block: 'center' }); }
}

function openStory(i) {
  if (i < 0 || i >= S.stories.length) return;
  // A tap within a moment of the stream being redrawn by itself (a refresh, not him) lands on whatever moved: ignored.
  if (S.scene === 'stream' && performance.now() - (S.redrawnAt || 0) < 350) return;
  if (S.scene === 'stream' && $('scroll')) S.streamTop = $('scroll').scrollTop;
  S.scene = 'reader'; S.at = i; want(S.stories[i]); draw();
  if ($('art')) $('art').scrollTop = 0;
}
window.somaNext = () => openStory(S.at + 1);

/** Back: from a story to the stream; at the stream, the app closes (false). */
window.somaBack = function () {
  if (S.scene === 'reader') { S.scene = 'stream'; draw(); return true; }
  return false;
};

function refresh() {
  if (S.refreshing) return;
  S.refreshing = true; draw();
  Native.refresh();
}

// A refresh never moves the stream under his finger: while he is down the stream or reading a story, the new stories
// wait (the "↑ N new" pill says so) and come in when he goes back to the top or taps the pill. Applied at once, they
// pushed every story down and a tap meant for "Show 20 more" opened a Politico story (175 walk, 2026-10-29).
const settled = () => S.scene === 'stream' && (!$('scroll') || $('scroll').scrollTop < 60);
function takeFresh() {
  if (!S.pending) return false;
  const before = new Set(S.stories.map(s => s.id));
  S.stories = S.pending.stories || []; S.updated = S.pending.updated || S.updated; S.pending = null;
  if (before.size) S.fresh = S.stories.filter(s => !before.has(s.id)).length;
  return true;
}
window.somaRefreshed = function (err) {
  S.refreshing = false; S.redrawnAt = performance.now();
  if (err) { S.toast = err; setTimeout(() => { S.toast = ''; draw(); }, 3500); }
  else {
    try { S.pending = JSON.parse(Native.stream()); } catch (e) { S.pending = null; }
    if (S.pending && (!S.stories.length || settled())) takeFresh();
    else if (S.pending) { const have = new Set(S.stories.map(s => s.id)); S.fresh = (S.pending.stories || []).filter(s => !have.has(s.id)).length; }
  }
  if (S.scene === 'stream') draw();
};
window.takeNew = () => { takeFresh(); S.fresh = 0; draw(); if ($('scroll')) $('scroll').scrollTo({ top: 0, behavior: 'smooth' }); };
// Back at the top of the stream, the waiting stories come in.
document.addEventListener('scroll', e => { if (e.target.id === 'scroll' && S.pending && settled() && takeFresh()) draw(); }, true);

let lastLayout = layout();
addEventListener('resize', () => { const l = layout(); if (l !== lastLayout) { lastLayout = l; draw(); } });

load();
draw();
if (!S.stories.length || Date.now() / 1000 - S.updated > 3600) refresh();
</script>
</body>
</html>
