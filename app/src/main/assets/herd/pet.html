<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herd</title>
<style>
:root {
  --wool: #f7f2e8; --wool-edge: #e3d9c6; --face: #3b3442; --cheek: #f2a7a0; --leg: #4a4250;
  --panel: #faf8f4; --panel-edge: rgba(40, 32, 48, .12); --ink: #231d29; --ink-2: #6b6272; --ink-3: #9c94a2;
  --row-hover: rgba(40, 32, 48, .06); --line: rgba(40, 32, 48, .08);
  --need: #e8833a; --ready: #2f8f83; --work: #5a7fd6; --idle: #a39ba8;
  --shadow: 0 18px 50px rgba(30, 20, 40, .22), 0 2px 8px rgba(30, 20, 40, .08);
  --drop-veil: rgba(226, 244, 240, .86);
}
@media (prefers-color-scheme: dark) {
  :root {
    --panel: #201c26; --panel-edge: rgba(255, 255, 255, .09); --ink: #f3eef6; --ink-2: #b4abbb; --ink-3: #7f7686;
    --row-hover: rgba(255, 255, 255, .06); --line: rgba(255, 255, 255, .07);
    --shadow: 0 18px 50px rgba(0, 0, 0, .5), 0 2px 8px rgba(0, 0, 0, .3);
    --drop-veil: rgba(18, 44, 41, .84);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; -webkit-tap-highlight-color: transparent;
  font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; color: var(--ink);
  -webkit-user-select: none; user-select: none; }

/* ---------------------------------------------------------------- the sheep */
#pet { position: fixed; right: 6px; bottom: 4px; width: 120px; height: 120px; cursor: grab; }
#pet svg { width: 100%; height: 100%; overflow: visible; }
#sheep { transform-origin: 60px 100px; }
.eye-open { transform-box: fill-box; transform-origin: center; animation: blink 5.5s infinite; }
.eye-shut { display: none; }
.legs rect { transform-box: fill-box; transform-origin: top center; }
.zzz, .dots, .bang { opacity: 0; }

#pet.sleep .eye-open { display: none; }
#pet.sleep .eye-shut { display: inline; }
#pet.sleep #sheep { animation: breathe 4s ease-in-out infinite; }
#pet.sleep .zzz { opacity: 1; }
#pet.sleep .zzz text { animation: drift 3.6s ease-out infinite; }
#pet.sleep .zzz text:nth-child(2) { animation-delay: 1.2s; }
#pet.sleep .zzz text:nth-child(3) { animation-delay: 2.4s; }

#pet.work #sheep { animation: bob .9s ease-in-out infinite; }
#pet.work .legs rect:nth-child(odd) { animation: step .45s ease-in-out infinite alternate; }
#pet.work .legs rect:nth-child(even) { animation: step .45s ease-in-out infinite alternate-reverse; }
#pet.work .dots { opacity: 1; }
#pet.work .dots circle { animation: dot 1.2s ease-in-out infinite; }
#pet.work .dots circle:nth-child(2) { animation-delay: .2s; }
#pet.work .dots circle:nth-child(3) { animation-delay: .4s; }

#pet.alert #sheep { animation: hop 1.4s cubic-bezier(.3, 0, .3, 1) infinite; }
#pet.alert .bang { opacity: 1; }
#pet.alert .bang g { animation: wobble 1.4s ease-in-out infinite; transform-origin: 98px 30px; }

#pet.offline { filter: grayscale(1) opacity(.6); }
#pet.happy #sheep { animation: hop .5s cubic-bezier(.3, 0, .3, 1) 2; }

@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
@keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.02, .97); } }
@keyframes drift { 0% { opacity: 0; transform: translate(0, 0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(10px, -22px); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
@keyframes step { from { transform: scaleY(1); } to { transform: scaleY(.7); } }
@keyframes dot { 0%, 100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-2px); } }
@keyframes hop { 0%, 60%, 100% { transform: translateY(0) scale(1, 1); } 10% { transform: translateY(0) scale(1.06, .92); }
  25% { transform: translateY(-12px) scale(.97, 1.04); } 45% { transform: translateY(0) scale(1.05, .94); } }
@keyframes wobble { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-12deg); } 40% { transform: rotate(10deg); } 60% { transform: rotate(0); } }

/* A skin: a pixel sprite sheet from pet/skins, drawn in place of the sheep. The script picks the frame (its facing row
   and walk step); the outer box carries the mood's motion, the inner one the frame and its mirroring. */
#sprite { --fs: 96px; position: absolute; left: calc(60px - var(--fs) / 2); top: calc(104px - var(--fs));
  width: var(--fs); height: var(--fs); display: none; transform-origin: 50% 96%; }
#frame { width: 100%; height: 100%; background-repeat: no-repeat; image-rendering: pixelated; transform: scaleX(var(--mirror, 1)); }
#pet.skinned #sprite { display: block; }
#pet.skinned #sheep { display: none; }
#pet.sleep #sprite { animation: breathe 4s ease-in-out infinite; filter: saturate(.75) brightness(.92); }
#pet.work #sprite { animation: bob .9s ease-in-out infinite; }
#pet.alert #sprite { animation: hop 1.4s cubic-bezier(.3, 0, .3, 1) infinite; }
#pet.happy #sprite, #pet.happy #sheep { animation: hop .5s cubic-bezier(.3, 0, .3, 1) 2; }
#pet.walking #sprite { animation: none; }

/* Walking, and the little things it does while standing about. */
#pet.walking #sheep { animation: bob .45s ease-in-out infinite; }
#pet.walking .legs rect:nth-child(odd) { animation: step .3s ease-in-out infinite alternate; }
#pet.walking .legs rect:nth-child(even) { animation: step .3s ease-in-out infinite alternate-reverse; }
#turn { transform-origin: 60px 100px; transition: transform .25s ease; }
#pet[data-face=left] #turn { transform: rotate(-4deg); }
#pet[data-face=right] #turn { transform: rotate(4deg); }
.pupils { transition: transform .2s ease; }
#pet[data-face=left] .pupils { transform: translateX(-1.6px); }
#pet[data-face=right] .pupils { transform: translateX(1.6px); }
#pet[data-face=up] .pupils { transform: translateY(-1.8px); }
#pet.stretch #sprite, #pet.stretch #sheep { animation: stretch .9s ease-in-out 1; }
#pet.held #sprite, #pet.held #sheep { animation: dangle .5s ease-in-out infinite; }
#pet.landed #sprite, #pet.landed #sheep { animation: land .35s cubic-bezier(.3, 0, .3, 1) 1; }
@keyframes stretch { 0%, 100% { transform: scale(1, 1); } 40% { transform: scale(.94, 1.09); } 70% { transform: scale(1.03, .97); } }
@keyframes dangle { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
@keyframes land { 0% { transform: scale(1.12, .86); } 100% { transform: scale(1, 1); } }

/* The shell says which side of the window the pet stands on (the Mac moves it to the left near the screen's edge). */
body.left #pet { right: auto; left: 6px; }
body.left #panel { right: auto; left: 8px; }

.looks { display: grid; grid-template-columns: repeat(auto-fill, minmax(82px, 1fr)); gap: 6px; padding: 8px; }
.look { border: 1.5px solid transparent; background: var(--row-hover); border-radius: 12px; padding: 8px 4px 6px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px; font: inherit; font-size: 11px; color: var(--ink-2); }
.look:hover { border-color: var(--line); }
.look.on { border-color: var(--ink); color: var(--ink); font-weight: 600; }
.look i { width: 56px; height: 56px; background-repeat: no-repeat; background-size: auto 56px; image-rendering: pixelated; display: block; }
.look svg { width: 56px; height: 56px; }
.note { color: var(--ink-3); font-size: 11px; padding: 2px 12px 8px; }
.boxes .look b { width: 72px; height: 36px; display: block; background-size: 100% 100%; image-rendering: pixelated; }
.boxes .look b.plain { background: #f8f8f8; border: 3px solid #5d6f87; border-radius: 6px; box-shadow: inset 0 0 0 2px #c9d3df; }

#badge { position: absolute; left: 8px; top: 22px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px;
  background: var(--need); color: #fff; font-weight: 700; font-size: 12px; line-height: 22px; text-align: center;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .2); transform: scale(0); transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); }
#badge.on { transform: scale(1); }
#badge.ready { background: var(--ready); }

/* The speech bubble: a game-style text box, typed out a letter at a time. A frame from pet/ui (served by a
   reporter, 9-sliced) replaces the drawn one when there is one. */
#bubble { position: fixed; right: 12px; bottom: 108px; width: max-content; max-width: min(250px, calc(100vw - 24px));
  opacity: 0; transform: translateY(6px); transition: opacity .15s, transform .15s; pointer-events: none; cursor: pointer; }
#bubble.on { opacity: 1; transform: none; pointer-events: auto; }
body.open #bubble { display: none; }
body.left #bubble { right: auto; left: 12px; }
#bubble .box { position: relative; padding: 8px 12px 10px; background: #f8f8f8; color: #404850;
  border: 3px solid #5d6f87; border-radius: 7px; box-shadow: inset 0 0 0 2px #c9d3df, 0 4px 14px rgba(20, 20, 40, .25);
  font: 600 12.5px/1.4 -apple-system, BlinkMacSystemFont, "Inter", sans-serif; text-shadow: 1px 1px 0 #d4d4cc; }
#bubble.framed .box { border-style: solid; border-radius: 0; box-shadow: 0 4px 14px rgba(20, 20, 40, .25); background: none; image-rendering: pixelated; }
#bubble.game-font .who { font: inherit; opacity: .6; }
#bubble .who { display: block; font-size: 10.5px; letter-spacing: .02em; opacity: .7; margin-bottom: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
#bubble .more { position: absolute; right: 7px; bottom: 3px; font-size: 8px; font-style: normal; opacity: 0; }
#bubble.typed .more { opacity: 1; animation: nudge .8s steps(2) infinite; }
@keyframes nudge { 50% { transform: translateY(2px); } }
#bubble .tail { position: absolute; right: 34px; bottom: -9px; width: 14px; height: 10px; background: var(--tail-edge, #5d6f87);
  clip-path: polygon(0 0, 100% 0, 30% 100%); }
#bubble .tail::after { content: ""; position: absolute; left: 3px; top: 0; width: 8px; height: 6px; background: var(--tail-fill, #f8f8f8);
  clip-path: polygon(0 0, 100% 0, 25% 100%); }
body.left #bubble .tail { right: auto; left: 34px; transform: scaleX(-1); }

/* ---------------------------------------------------------------- the panel */
#panel { position: fixed; right: 8px; bottom: 128px; width: min(372px, calc(100vw - 16px)); max-height: calc(var(--room, 100vh) - 140px); display: flex; flex-direction: column; overflow: hidden;
  background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 18px; box-shadow: var(--shadow);
  display: none; }
/* No backdrop-filter here, or on the menu or the drop veil: in the Mac's transparent window there's nothing behind
   the page to blur, and each such layer appearing or redrawing made WebKit flash the whole window opaque, then clear. */
/* Shown at once, not faded in: the window grows in the same moment, and a fade started while it was small can stay
   stuck at its first frame in Android's WebView. */
body.open #panel { display: flex; }

header { padding: 14px 16px 10px; display: flex; align-items: flex-start; gap: 10px; }
header h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
header p { margin: 2px 0 0; color: var(--ink-2); font-size: 12px; }
header .grow { flex: 1; min-width: 0; }
.icon-btn { border: 0; background: transparent; color: var(--ink-3); width: 26px; height: 26px; border-radius: 8px; cursor: pointer;
  display: grid; place-items: center; font-size: 15px; }
.icon-btn:hover { background: var(--row-hover); color: var(--ink); }

nav { display: flex; gap: 4px; padding: 0 12px 8px; border-bottom: 1px solid var(--line); }
nav button { border: 0; background: transparent; color: var(--ink-2); font: inherit; font-weight: 600; font-size: 12px;
  padding: 5px 10px; border-radius: 8px; cursor: pointer; }
nav button:hover { background: var(--row-hover); }
nav button.on { background: var(--ink); color: var(--panel); }

main { overflow-y: auto; padding: 6px 6px 10px; flex: 1; min-height: 0; }
main::-webkit-scrollbar { width: 6px; }
main::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

.machine { padding: 8px 10px 4px; display: flex; align-items: baseline; gap: 8px; }
.machine b { font-size: 12px; font-weight: 700; }
.machine span { color: var(--ink-3); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { display: inline-block; font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 6px; margin-left: auto; flex: none; }
.chip.rc-on { background: rgba(47, 143, 131, .14); color: var(--ready); }
.chip.rc-off { background: var(--row-hover); color: var(--ink-3); }

.row { display: flex; gap: 10px; align-items: flex-start; padding: 7px 10px; border-radius: 10px; cursor: pointer; }
.row:hover { background: var(--row-hover); }
.dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 4px; flex: none; background: var(--idle); }
.dot.needs-you { background: var(--need); box-shadow: 0 0 0 3px rgba(232, 131, 58, .2); }
.dot.your-turn { background: var(--ready); }
.dot.your-turn.seen { background: transparent; border: 1.5px solid var(--ready); }
.dot.working { background: var(--work); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.row .txt { min-width: 0; flex: 1; }
.row .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { color: var(--ink-3); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub em { font-style: normal; color: var(--ink-2); }
.empty { color: var(--ink-3); font-size: 12px; padding: 4px 10px 8px 29px; }
.foot { color: var(--ink-3); font-size: 11px; padding: 10px 10px 2px; border-top: 1px solid var(--line); margin-top: 6px; }

.detail-head { padding: 6px 10px 10px; }
.detail-head .back { border: 0; background: transparent; color: var(--ink-2); font: inherit; font-size: 12px; cursor: pointer; padding: 0; margin-bottom: 6px; }
.detail-head .back:hover { color: var(--ink); }
.detail-head h2 { margin: 0; font-size: 14px; line-height: 1.3; }
.detail-head p { margin: 3px 0 0; color: var(--ink-3); font-size: 11px; word-break: break-all; }
.turn { margin: 0 6px 8px; padding: 8px 10px; border-radius: 12px; background: var(--row-hover); white-space: pre-wrap; word-wrap: break-word;
  font-size: 12px; max-height: 220px; overflow: hidden; -webkit-user-select: text; user-select: text; }
.turn.you { background: transparent; border: 1px solid var(--line); }
.turn .who { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin-bottom: 3px; }
.actions { display: flex; gap: 6px; padding: 4px 10px 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-size: 12px; font-weight: 600;
  padding: 5px 10px; border-radius: 8px; cursor: pointer; }
.btn:hover { background: var(--row-hover); }
.btn.primary { background: var(--ink); color: var(--panel); border-color: transparent; }

.drop { margin: 8px; padding: 22px 14px; border: 1.5px dashed var(--line); border-radius: 14px; text-align: center; color: var(--ink-2); }
.drop b { display: block; color: var(--ink); font-size: 13px; margin-bottom: 3px; }
.drop.has { border-style: solid; text-align: left; }
/* While files are dragged over the open panel, the whole panel is the drop target. */
body.dropping #panel { box-shadow: 0 0 0 2px var(--ready), var(--shadow); }
body.dropping #panel::after { content: "Drop to put it in the pocket"; position: absolute; inset: 0; display: grid; place-items: center;
  border-radius: 18px; background: var(--drop-veil); color: var(--ink); font-size: 14px; font-weight: 700; pointer-events: none; }
.files { margin: 6px 0 0; padding: 0; list-style: none; font-size: 12px; color: var(--ink); }
.files li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { padding: 4px 18px; font-size: 12px; color: var(--ink-2); }
.status:empty { display: none; }
.section { padding: 14px 12px 2px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }
.busy { margin: 4px 8px; padding: 7px 10px; border-radius: 10px; font-size: 12px; color: var(--ink-2); background: var(--row-hover); }
.busy.failed { color: var(--need); }
/* The pocket: one rail of square tiles (pictures, videos, files), which can open into a 4-column grid, then text rows. */
.phead { display: flex; align-items: center; gap: 6px; padding: 14px 12px 4px; }
/* The same look as the tab's other section headers (.section: "Sent to this Mac"). */
.phead b { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }
.phead .info { color: var(--ink-3); cursor: help; font-size: 13px; line-height: 1; }
.linkbtn { margin-left: auto; border: 0; background: transparent; color: var(--ink-2); font: inherit; font-size: 11px; font-weight: 600;
  padding: 2px 6px; border-radius: 6px; cursor: pointer; }
.linkbtn:hover { background: var(--row-hover); color: var(--ink); }
.rail { display: flex; gap: 8px; overflow-x: auto; padding: 4px 12px 8px; scroll-snap-type: x proximity; scroll-padding: 0 12px; }
.rail::-webkit-scrollbar { height: 5px; }
.rail::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
.rail.grid { display: grid; grid-template-columns: repeat(4, 64px); justify-content: space-between; row-gap: 10px; overflow: visible; }
.tile { flex: none; width: 64px; position: relative; scroll-snap-align: start; cursor: pointer; -webkit-touch-callout: none; }
.tile .sq { position: relative; width: 64px; height: 64px; border-radius: 10px; overflow: hidden; background: var(--row-hover);
  display: grid; place-items: center; }
.tile .sq img { width: 100%; height: 100%; object-fit: cover; display: block; -webkit-user-drag: none; }
.tile .glyph { font-size: 26px; }
.tile.kind-video .sq::after { content: "▶"; position: absolute; left: 4px; bottom: 4px; width: 18px; height: 18px; border-radius: 9px;
  background: rgba(0, 0, 0, .55); color: #fff; font-size: 8px; line-height: 18px; text-align: center; }
.tile .cap { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 3px;
  font-size: 10px; line-height: 1.25; color: var(--ink-2); word-break: break-word; }
.tile.pinned::before { content: "★"; position: absolute; top: 3px; right: 4px; z-index: 1; font-size: 11px; color: #f2c14e;
  text-shadow: 0 1px 2px rgba(0, 0, 0, .6); }
.tile.new .sq { box-shadow: 0 0 0 2px var(--ready); }
.tile:hover .sq { filter: brightness(1.06); }
.trow { display: flex; gap: 8px; align-items: flex-start; margin: 2px 8px 4px; padding: 6px 8px; border-radius: 10px; background: var(--row-hover); }
.trow.new { box-shadow: inset 3px 0 0 var(--ready); }
.trow .star { color: #f2c14e; font-size: 11px; }
.trow .ttext { flex: 1; min-width: 0; font-size: 12px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; white-space: pre-wrap; word-break: break-word; cursor: pointer; -webkit-user-select: text; user-select: text; }
.trow .ttext.full { display: block; }
#pmenu { position: fixed; z-index: 50; min-width: 180px; max-width: 260px; padding: 5px; display: none; background: var(--panel);
  border: 1px solid var(--panel-edge); border-radius: 11px; box-shadow: var(--shadow); }
#pmenu.on { display: block; }
#pmenu .meta { padding: 5px 9px 7px; margin-bottom: 4px; border-bottom: 1px solid var(--line); font-size: 11px; color: var(--ink-3); }
#pmenu .meta b { display: block; color: var(--ink); font-size: 12px; word-break: break-all; margin-bottom: 2px; }
#pmenu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: var(--ink); font: inherit;
  font-size: 12.5px; padding: 6px 9px; border-radius: 7px; cursor: pointer; }
#pmenu button:hover { background: var(--row-hover); }
#pmenu button.danger { color: var(--need); }

/* Tailshare: what the other devices sent this computer (~/Inbox), newest first. */
nav button .count { display: inline-block; min-width: 16px; height: 16px; padding: 0 4px; margin-left: 5px; border-radius: 8px;
  background: var(--ready); color: #fff; font-size: 10px; line-height: 16px; text-align: center; vertical-align: 1px; }
.sendrow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 8px 10px 6px; }
.sendrow > span { color: var(--ink-3); font-size: 11px; margin-right: 2px; }
.btn.small { padding: 3px 8px; font-size: 11px; }
.item { margin: 6px 4px 8px; padding: 9px 10px 8px; border-radius: 12px; background: var(--row-hover); }
.item.new { box-shadow: inset 3px 0 0 var(--ready); }
.item-head { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-3); margin-bottom: 6px; }
.item-head b { color: var(--ink-2); font-weight: 700; }
.item-head .icon-btn { margin-left: auto; width: 20px; height: 20px; font-size: 11px; }
.clip { white-space: pre-wrap; word-wrap: break-word; font-size: 12px; line-height: 1.4; max-height: 7.2em; overflow: hidden;
  position: relative; cursor: pointer; -webkit-user-select: text; user-select: text; }
.clip.long::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 1.6em;
  background: linear-gradient(transparent, var(--panel)); opacity: .9; pointer-events: none; }
.clip.full { max-height: none; }
.clip.full::after { display: none; }
.item img { display: block; max-width: 100%; max-height: 180px; border-radius: 8px; background: var(--line); cursor: pointer; }
.file { display: flex; gap: 8px; align-items: center; font-size: 12px; min-width: 0; }
.file span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.file em { font-style: normal; color: var(--ink-3); flex: none; }
.item .actions { padding: 8px 0 0; }

/* Choosing several (Boss, 2026-10-28: "an easy way to multi-select on the herd Tailshare tab ... delete multiple files
   at once"): a long-press starts it, taps add more; a bar with the count, Select all and Delete; one confirm. */
.selbar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 10px;
  background: var(--panel); border-bottom: 1px solid var(--line); }
.selbar b { font-size: 12px; margin-right: auto; white-space: nowrap; }
.btn.danger { background: var(--need); color: #fff; border-color: transparent; }
.btn:disabled { opacity: .45; cursor: default; }
body.selecting [data-sel] { position: relative; cursor: pointer; -webkit-user-select: none; user-select: none; }
body.selecting [data-sel]::after { content: ""; position: absolute; top: 4px; left: 4px; z-index: 2; width: 16px; height: 16px;
  border-radius: 9px; border: 1.5px solid var(--ink-3); background: var(--panel); box-sizing: border-box; }
body.selecting [data-sel].sel::after { content: "✓"; background: var(--ready); border-color: var(--ready); color: #fff;
  font-size: 10px; line-height: 13px; text-align: center; font-weight: 700; }
body.selecting .tile.sel .sq, body.selecting .trow.sel, body.selecting .item.sel { box-shadow: 0 0 0 2px var(--ready); }
body.selecting .trow, body.selecting .item { padding-left: 26px; }
.confirm { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(0, 0, 0, .35); }
.confirm .sheet { width: min(320px, 100%); padding: 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--panel-edge);
  box-shadow: var(--shadow); }
.confirm .sheet b { display: block; font-size: 14px; margin-bottom: 4px; }
.confirm .sheet p { margin: 0 0 12px; color: var(--ink-2); font-size: 12px; }
.confirm .actions { display: flex; justify-content: flex-end; gap: 8px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div id="panel" role="dialog" aria-label="Herd">
  <header>
    <div class="grow"><h1>Herd</h1><p id="summary">Looking around…</p></div>
    <button class="icon-btn" id="close" title="Close" aria-label="Close">✕</button>
  </header>
  <nav id="jobs"></nav>
  <main id="view"></main>
</div>

<div id="pmenu" role="menu"></div>

<div id="bubble" role="status"><div class="box"><b class="who"></b><span class="say"></span><i class="more">▼</i></div><div class="tail"></div></div>

<div id="pet" class="sleep" aria-label="Herd">
  <svg viewBox="0 0 120 120" aria-hidden="true">
    <ellipse cx="60" cy="104" rx="34" ry="5" fill="rgba(30,20,40,.16)"/>
    <g id="turn"><g id="sheep">
      <g class="legs" fill="var(--leg)">
        <rect x="37" y="86" width="7" height="15" rx="3.5"/>
        <rect x="48" y="88" width="7" height="14" rx="3.5"/>
        <rect x="66" y="88" width="7" height="14" rx="3.5"/>
        <rect x="77" y="86" width="7" height="15" rx="3.5"/>
      </g>
      <g fill="var(--wool)" stroke="var(--wool-edge)" stroke-width="1.5">
        <circle cx="34" cy="66" r="15"/><circle cx="86" cy="66" r="15"/>
        <circle cx="44" cy="50" r="17"/><circle cx="76" cy="50" r="17"/><circle cx="60" cy="44" r="18"/>
        <circle cx="40" cy="80" r="13"/><circle cx="80" cy="80" r="13"/><circle cx="60" cy="84" r="14"/>
      </g>
      <ellipse cx="60" cy="66" rx="34" ry="22" fill="var(--wool)"/>
      <g fill="var(--face)">
        <ellipse cx="40" cy="62" rx="9" ry="4.5" transform="rotate(-24 40 62)"/>
        <ellipse cx="80" cy="62" rx="9" ry="4.5" transform="rotate(24 80 62)"/>
        <ellipse cx="60" cy="68" rx="18" ry="20"/>
      </g>
      <g fill="var(--wool)" stroke="var(--wool-edge)" stroke-width="1.2">
        <circle cx="52" cy="50" r="7"/><circle cx="60" cy="47" r="8"/><circle cx="68" cy="50" r="7"/>
      </g>
      <g class="eye-open">
        <circle cx="53" cy="66" r="4.2" fill="#fff"/><circle cx="67" cy="66" r="4.2" fill="#fff"/>
        <g class="pupils"><circle cx="54" cy="67" r="2.2" fill="#1b1620"/><circle cx="68" cy="67" r="2.2" fill="#1b1620"/>
        <circle cx="54.8" cy="65.8" r=".8" fill="#fff"/><circle cx="68.8" cy="65.8" r=".8" fill="#fff"/></g>
      </g>
      <g class="eye-shut" stroke="#fff" stroke-width="1.8" stroke-linecap="round" fill="none">
        <path d="M49.5 67 q3.5 2.6 7 0"/><path d="M63.5 67 q3.5 2.6 7 0"/>
      </g>
      <ellipse cx="47" cy="75" rx="3.4" ry="2" fill="var(--cheek)" opacity=".7"/>
      <ellipse cx="73" cy="75" rx="3.4" ry="2" fill="var(--cheek)" opacity=".7"/>
      <path d="M56.5 78 q3.5 3 7 0" stroke="#fff" stroke-width="1.6" stroke-linecap="round" fill="none" opacity=".85"/>
    </g></g>
    <g class="zzz" fill="var(--ink-3)" font-weight="700" font-family="-apple-system, sans-serif">
      <text x="88" y="34" font-size="10">z</text><text x="94" y="26" font-size="12">z</text><text x="100" y="18" font-size="14">Z</text>
    </g>
    <g class="dots" fill="var(--work)"><circle cx="92" cy="30" r="2.6"/><circle cx="100" cy="30" r="2.6"/><circle cx="108" cy="30" r="2.6"/></g>
    <g class="bang"><g>
      <circle cx="98" cy="28" r="11" fill="var(--need)"/>
      <rect x="96.4" y="20" width="3.2" height="10" rx="1.6" fill="#fff"/><circle cx="98" cy="34.2" r="1.8" fill="#fff"/>
    </g></g>
  </svg>
  <div id="sprite"><div id="frame"></div></div>
  <div id="badge"></div>
</div>

<script>
/* Herd pet. The native shell (Mac: Swift, Fold: omalauncher) calls herd.update(json) with `herd --json` output,
   herd.detail(json) with `herd show ID --json`, herd.sent(text), herd.tap() and, for the pocket, herd.pocketDropped,
   herd.pocketBusy and herd.pocketPulled.
   It listens for {cmd: expand | collapse | show | send | copy}. */
const native = window.webkit?.messageHandlers?.herd ? m => window.webkit.messageHandlers.herd.postMessage(m)
             : window.HerdAndroid ? m => window.HerdAndroid.post(JSON.stringify(m))
             : null;
const shell = m => native && native(m);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const store = {
  get(key, fallback) { try { return JSON.parse(localStorage.getItem('herd.' + key)) ?? fallback; } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem('herd.' + key, JSON.stringify(value)); } catch {} },
};

let data = null, previous = {}, seen = store.get('seen', null), job = store.get('job', 'agents'), detail = null;
const firstRun = seen === null;
if (firstRun) seen = {};

function ago(t) {
  const s = Math.max(0, Date.now() / 1000 - t);
  return s < 60 ? 'now' : s < 3600 ? Math.floor(s / 60) + 'm' : s < 86400 ? Math.floor(s / 3600) + 'h' : Math.floor(s / 86400) + 'd';
}
function sessions() {
  return (data?.machines || []).flatMap(m => (m.report?.sessions || []).map(s => ({ ...s, machine: m.name, os: m.os })));
}
const isUnseen = s => s.state === 'your-turn' && (seen[s.id] || 0) < s.updated;

/* ---------------------------------------------------------------- jobs: each one is a tab in the panel */
const jobs = [
  { id: 'agents', title: 'Agents', render: renderAgents },
  { id: 'look', title: 'Look', render: renderLook },
  // The shared pocket, plus what tailshare sent this computer. On the Mac always; elsewhere once the shell says it can
  // upload and pull (herd.caps({pocket: true}); see omalauncher's CURRENT-STATE.md for the phone's hooks).
  { id: 'tailshare', title: 'Tailshare', render: renderTailshare, count: () => unseenInbox().length + unseenPocket().length,
    when: () => !window.HerdAndroid || caps.pocket },
];
const shownJobs = () => jobs.filter(j => !j.when || j.when());
if (job === 'send') job = 'tailshare';

function renderJobs() {
  if (!shownJobs().some(j => j.id === job)) job = 'agents';
  $('jobs').innerHTML = shownJobs().map(j => {
    const n = j.count?.() || 0;
    return `<button data-job="${j.id}" class="${j.id === job ? 'on' : ''}">${esc(j.title)}${n ? `<span class="count">${n}</span>` : ''}</button>`;
  }).join('');
}
$('jobs').addEventListener('click', e => {
  const id = e.target.dataset?.job; if (!id) return;
  job = id; detail = null; store.set('job', job); quitSelect(); render();
});

function render() {
  renderJobs();
  (shownJobs().find(j => j.id === job) || jobs[0]).render($('view'));
}

const PHONES = ['android', 'iOS'];   // a phone with its own reporter (the Fold) is listed with the machines, but isn't a computer
const ORDER = { 'needs-you': 0, 'your-turn': 1, working: 2, idle: 3, closed: 4 };
const WORDS = { 'needs-you': 'needs you', 'your-turn': 'your turn', working: 'working', idle: 'idle', closed: 'closed' };

function renderAgents(view) {
  if (detail) return renderDetail(view);
  if (!data) { view.innerHTML = '<div class="empty">Asking the machines…</div>'; return; }
  if (data.error && !data.machines.length) { view.innerHTML = `<div class="empty">${esc(data.error)}</div>`; return; }
  let html = '';
  const machines = data.machines.slice().sort((a, b) => (b.self - a.self) || (!!a.error - !!b.error) || a.name.localeCompare(b.name));
  for (const m of machines) {
    const info = m.report?.machine || {};
    const rc = info.remote_control;
    const chip = !m.report || !('remote_control' in info) ? '' : rc?.length ? `<span class="chip rc-on" title="Remote Control">RC on</span>` : `<span class="chip rc-off" title="Remote Control">RC off</span>`;
    const meta = m.error ? m.error : [info.gpu ? `GPU ${Math.round(info.gpu.used_mb / 1024)}/${Math.round(info.gpu.total_mb / 1024)} GB` : '', info.load != null ? 'load ' + info.load.toFixed(1) : ''].filter(Boolean).join(' · ');
    html += `<div class="machine"><b>${esc(m.name)}${m.self ? ' · this one' : ''}</b><span>${esc(meta)}</span>${chip}</div>`;
    // Needs you, then just finished, then working, then the ones already seen waiting.
    const rank = s => s.state === 'your-turn' ? (isUnseen(s) ? 1 : 3) : s.state === 'working' ? 2 : ORDER[s.state] + 2;
    const rows = (m.report?.sessions || []).slice().sort((a, b) => (rank(a) - rank(b)) || (b.updated - a.updated));
    if (m.report && !rows.length) html += `<div class="empty">Nothing running</div>`;
    for (const s of rows) {
      const unseen = isUnseen(s);
      const word = s.state === 'your-turn' ? (unseen ? 'finished' : 'waiting for you') : WORDS[s.state] || s.state;
      html += `<div class="row" data-id="${esc(s.id)}">
        <span class="dot ${s.state} ${s.state === 'your-turn' && !unseen ? 'seen' : ''}"></span>
        <div class="txt"><div class="title">${esc(s.title)}</div>
        <div class="sub"><em>${esc(word)}</em> · ${esc(s.project || '—')} · ${esc(s.app || s.kind)} · ${ago(s.updated)}</div></div></div>`;
    }
  }
  const off = (data.others || []).filter(h => !h.online).map(h => h.name);
  const clients = (data.others || []).filter(h => h.online).map(h => h.name);
  if (clients.length || off.length)
    html += `<div class="foot">${clients.length ? 'Also online: ' + esc(clients.join(', ')) + '<br>' : ''}${off.length ? 'Offline: ' + esc(off.join(', ')) : ''}</div>`;
  view.innerHTML = html;
}

$('view').addEventListener('click', e => {
  const row = e.target.closest('.row');
  if (row) { detail = { id: row.dataset.id, loading: true }; render(); shell({ cmd: 'show', id: row.dataset.id }); if (!native) mockDetail(row.dataset.id); return; }
  const act = e.target.closest('[data-act]');
  if (!act) return;
  const a = act.dataset.act;
  if (a === 'back') { detail = null; render(); }
  if (a === 'copy') { shell({ cmd: 'copy', text: act.dataset.text }); flash('Copied'); }
  if (a === 'pocketget') {
    shell({ cmd: 'pocketget', id: act.dataset.id, name: act.dataset.name, action: act.dataset.action });
    pocketSay({ open: 'Opening ', save: 'Saving ', copy: 'Copying ' }[act.dataset.action] + act.dataset.name + '…');
  }
  if (a === 'selclose') return endSelect();
  if (a === 'selall') { const all = Sel.keys(pocket?.items || [], inbox || []); chosen = Sel.all(chosen, all); return render(); }
  if (a === 'selmore') { const id = Sel.split(chosen).pocket[0], r = act.getBoundingClientRect(); return pocketMenu(id, r.left, r.bottom + 4); }
  if (a === 'seldelete') { if (chosen.size) { confirming = true; render(); } return; }
  if (a === 'selcancel') { if (e.target.closest('.sheet') && !e.target.closest('[data-act="selcancel"]')) return; confirming = false; return render(); }
  if (a === 'selyes') return deleteChosen();
  if (a === 'pocketgrid') { pocketGrid = !pocketGrid; store.set('pocketGrid', pocketGrid); render(); }
  if (a === 'pocketpin') pocketPin(act.dataset.id);
  if (a === 'pocketremove') pocketRemove(act.dataset.id);
  if (a === 'sendclip') { shell({ cmd: 'sendclip', device: act.dataset.device }); $('sendStatus').textContent = 'Sending your clipboard to ' + act.dataset.device + '…'; }
  // On the phone, what it received is the shell's list: one command, inboxget, with the action.
  const phone = !!window.HerdAndroid;
  if (a === 'copyitem') {
    shell(phone ? { cmd: 'inboxget', name: act.dataset.name, action: 'copy' } : { cmd: 'copyitem', name: act.dataset.name });
    act.textContent = 'Copied ✓';
    setTimeout(() => { act.textContent = 'Copy'; }, 1600);
  }
  if (a === 'openitem') shell(phone ? { cmd: 'inboxget', name: act.dataset.name, action: 'open' } : { cmd: 'openitem', name: act.dataset.name });
  if (a === 'reveal') shell({ cmd: 'reveal', name: act.dataset.name || '' });
  if (a === 'trash') {
    inbox = (inbox || []).filter(i => i.name !== act.dataset.name); render();
    shell(phone ? { cmd: 'inboxget', name: act.dataset.name, action: 'remove' } : { cmd: 'trash', name: act.dataset.name });
  }
  if (a === 'expand') { act.classList.toggle('full'); expanded[act.classList.contains('full') ? 'add' : 'delete'](act.dataset.name); }
});

function renderDetail(view) {
  const s = sessions().find(x => x.id === detail.id) || detail.session || {};
  let html = `<div class="detail-head"><button class="back" data-act="back">‹ All agents</button>
    <h2>${esc(s.title || detail.id)}</h2><p>${esc(s.machine || detail.machine || '')} · ${esc(s.cwd || '')}</p></div>`;
  html += `<div class="actions"><button class="btn" data-act="copy" data-text="${esc(s.id)}">Copy session id</button>`;
  if (s.cwd && s.kind === 'claude' && !PHONES.includes(s.os) && s.app !== 'fold') html += `<button class="btn" data-act="copy" data-text="${esc(`cd ${JSON.stringify(s.cwd)} && claude --resume ${s.id}`)}">Copy resume command</button>`;
  html += `</div>`;
  if (detail.loading) html += `<div class="empty">Reading…</div>`;
  if (detail.note) html += `<div class="empty">${esc(detail.note)}</div>`;
  for (const t of (detail.turns || []).slice(-8))
    html += `<div class="turn ${t.who}"><span class="who">${t.who === 'you' ? 'You' : 'Agent'}</span>${esc(t.text.length > 1400 ? t.text.slice(0, 1400) + '…' : t.text)}</div>`;
  view.innerHTML = html;
  view.scrollTop = view.scrollHeight;
}

/* ---------------------------------------------------------------- looks: the sheep, or a skin a machine serves */
let skin = store.get('skin', null);   // {name, url, frames} or null for the sheep

function skins() {
  // Each skin once, from the first machine that has it; its picture comes from that machine's reporter.
  const seen = new Map();
  for (const m of data?.machines || [])
    for (const s of m.report?.machine?.skins || [])
      if (!seen.has(s.name) && m.address) seen.set(s.name, { ...s, url: `http://${m.address}:8479/v1/skins/${encodeURIComponent(s.name)}/sheet.png${s.v ? '?v=' + s.v : ''}` });
  return [...seen.values()];
}

// The worn skin's sheet: one row per facing (walker skins) or a single row of frames side by side (older ones).
let look = null;

function wear() {
  // The phone's home widgets draw the pet too (Pet home, Steps): tell the shell what it wears. Only the phone asks.
  if (window.HerdAndroid) shell({ cmd: 'skin', skin });
  const pet = $('pet'), sprite = $('sprite'), frame = $('frame');
  pet.classList.toggle('skinned', !!skin);
  if (!skin) { look = null; return; }
  const fs = skin.display || 96;
  const frames = skin.frames || 1;
  const next = { url: skin.url, fs, rows: skin.rows || ['down'], stand: skin.stand ?? 0,
                 walk: skin.walk || (frames > 1 ? [...Array(frames).keys()] : [0]),
                 // Columns in the sheet: from its size when the reporter sends it, else the image's own once loaded.
                 cols: skin.sheet ? Math.round(skin.sheet[0] / (skin.frame?.[0] || 64)) : look?.url === skin.url ? look.cols : null };
  look = next;
  sprite.style.setProperty('--fs', fs + 'px');
  frame.style.backgroundImage = `url("${skin.url}")`;
  if (!next.cols) {
    // How many columns the sheet has decides how far apart frames are once it's scaled.
    const img = new Image();
    img.onload = () => { if (look === next) { next.cols = Math.max(1, Math.round(img.naturalWidth / (skin.frame?.[0] || 64))); paint(); } };
    img.src = skin.url;
  }
  paint();
}

/* Draws the frame for where it faces and how far through its step it is. A missing left or right row is the
   other one mirrored. */
function paint() {
  if (!look) return;
  const frame = $('frame');
  let row = look.rows.indexOf(facing), mirror = 1;
  if (row < 0) {
    const other = { left: 'right', right: 'left' }[facing];
    row = other ? look.rows.indexOf(other) : -1;
    mirror = row >= 0 ? -1 : 1;
    if (row < 0) row = 0;
  }
  const col = walking ? look.walk[step % look.walk.length] : look.stand;
  const cols = look.cols || 1;
  frame.style.backgroundSize = `${cols * look.fs}px ${look.rows.length * look.fs}px`;
  frame.style.backgroundPosition = `${-col * look.fs}px ${-row * look.fs}px`;
  frame.style.setProperty('--mirror', mirror);
}

// What is kept of a skin: enough to draw it before the first update arrives.
const pick = s => ({ name: s.name, url: s.url, frames: s.frames, display: s.display, rows: s.rows, stand: s.stand, walk: s.walk, frame: s.frame, sheet: s.sheet });

function renderLook(view) {
  const list = skins();
  const sheep = `<svg viewBox="16 20 88 90">${document.querySelector('#sheep').outerHTML.replace('id="sheep"', '')}</svg>`;  // a still copy
  let html = `<div class="looks"><button class="look ${skin ? '' : 'on'}" data-skin="">${sheep}Sheep</button>`;
  for (const s of list)
  {
    // Just the character: its standing frame, facing you, scaled like the pet draws it so a small figure (Crono)
    // isn't lost in its frame, and standing on the tile's floor.
    const fw = s.frame?.[0] || 64, fh = s.frame?.[1] || fw;
    // A whole-number zoom once it's past 1.5x keeps the pixels square (HeartGold's 32 px walkers draw at 2x).
    const zoom = 56 * (s.display || 96) / 96 / fh;
    const cell = Math.round(fh * (zoom >= 1.5 ? Math.round(zoom) : zoom)), inset = Math.round((cell - 56) / 2);
    const cols = s.sheet ? Math.round(s.sheet[0] / fw) : (s.frames || 1), rows = s.sheet ? Math.round(s.sheet[1] / fh) : 1;
    const row = Math.max(0, (s.rows || ['down']).indexOf('down')), col = s.stand ?? 0;
    const art = `background-image:url('${esc(s.url)}');background-size:${cols * cell}px ${rows * cell}px;` +
      `background-position:${-col * cell - inset}px ${-row * cell - (cell - 56)}px`;
    html += `<button class="look ${skin?.name === s.name ? 'on' : ''}" data-skin="${esc(s.name)}"><i style="${art}"></i>${esc(s.name.replace(/-/g, ' '))}</button>`;
  }
  html += `</div>`;
  const boxes = frames();
  if (boxes.length) {
    const now = frameUI()?.name ?? '';
    html += `<div class="note">Speech bubble</div><div class="looks boxes"><button class="look ${now ? '' : 'on'}" data-box=""><b class="plain"></b>Plain</button>`;
    for (const u of boxes)
      html += `<button class="look ${now === u.name ? 'on' : ''}" data-box="${esc(u.name)}"><b style="background-image:url('${esc(u.url)}')"></b>${esc(u.name.replace(/^hgss-message-?/, 'HeartGold ').trim())}</button>`;
    html += `</div>`;
  }
  if (!list.length) html += `<div class="note">No skins yet. They live in pet/skins on a machine with ClaudeSync; the reporter there serves them.</div>`;
  view.innerHTML = html;
}

$('view').addEventListener('click', e => {
  const box = e.target.closest('[data-box]');
  if (box) { style = box.dataset.box; store.set('bubble', style); render(); return; }
  const tile = e.target.closest('[data-skin]');
  if (!tile) return;
  const s = skins().find(x => x.name === tile.dataset.skin);
  skin = s ? pick(s) : null;
  store.set('skin', skin); wear(); render();
  const pet = $('pet'); pet.classList.add('happy'); setTimeout(() => pet.classList.remove('happy'), 1100);
});

/* ---------------------------------------------------------------- tailshare: what came in, and sending */
let inbox = null;                               // ~/Inbox as the shell lists it, newest first
let inboxSeen = store.get('inboxSeen', null);   // the newest arrival already looked at (its time)
const expanded = new Set();                     // long texts opened in full

const unseenInbox = () => (inbox || []).filter(i => inboxSeen !== null && i.t > inboxSeen);
function markInboxSeen() {
  const newest = Math.max(0, ...(inbox || []).map(i => i.t));
  if (newest > (inboxSeen || 0)) { inboxSeen = newest; store.set('inboxSeen', inboxSeen); }
}

/* ---------------------------------------------------------------- choosing several, to delete them at once */
// Pure, for tools/herd/select-test.mjs: keys are 'p:ID' (the pocket) and 'i:NAME' (sent to this device).
// <sel>
const Sel = {
  keys: (pocketItems, inboxItems) => [...pocketItems.map(i => 'p:' + i.id), ...inboxItems.map(i => 'i:' + i.name)],
  toggle(set, key) { const s = new Set(set); if (s.has(key)) s.delete(key); else s.add(key); return s; },
  // Select all, or with everything already chosen, none.
  all: (set, keys) => keys.length && keys.every(k => set.has(k)) ? new Set() : new Set(keys),
  // What is no longer listed (gone meanwhile) drops out.
  prune(set, keys) { const k = new Set(keys); return new Set([...set].filter(x => k.has(x))); },
  split(set) { const pocket = [], inbox = []; for (const k of set) (k.startsWith('p:') ? pocket : inbox).push(k.slice(2)); return { pocket, inbox }; },
  words: n => n === 1 ? 'Delete 1 file?' : `Delete ${n} files?`,
};

// All of them through the same deletes as one at a time: the pocket's DELETE, the list's remove (Trash on the Mac).
async function deleteChosen() {
  const { pocket: ids, inbox: names } = Sel.split(chosen), n = chosen.size, phone = !!window.HerdAndroid;
  if (pocket) pocket.items = pocket.items.filter(i => !ids.includes(i.id));

const POCKET = 'http://100.120.219.46:8480/v1/pocket';

let pocketSeen = store.get('pocketSeen', null);   // the newest pocket item already looked at (its time)

function markPocketSeen() {
  const newest = Math.max(0, ...(pocket?.items || []).map(i => i.t));
  if (newest > (pocketSeen || 0)) { pocketSeen = newest; store.set('pocketSeen', pocketSeen); }
}
const showing = () => document.body.classList.contains('open') && job === 'tailshare';
function pocketSay(text, ms = 4000) {

const TEST_POCKET = () => ({ days: 7, used: 0, cap: 1, host: 'test', items: ['alpha', 'bravo', 'charlie', 'delta', 'echo']
  .map((w, n) => ({ id: 'test-' + w, name: `test-${w}.txt`, kind: 'file', size: 1000 * (n + 1), t: 1e9 + n, device: 'test' })) });
const TEST_INBOX = () => ['one', 'two'].map((w, n) => ({ name: `test-sent-${w}.txt`, from: 'test', t: 1e9 + n, kind: 'text', text: 'Test text ' + w }));
let pocketDrawn = '';   // what the tab last drew from, so a poll that brings nothing new redraws nothing

async function fetchPocket() {
  // The emulator's walks (caps.test, herd/SheepPage.kt): made-up files, never the real pocket.
  if (caps.test) { if (!pocket) { pocket = TEST_POCKET(); inbox = TEST_INBOX(); if (showing()) render(); else renderJobs(); } return; }
  const before = pocket;
  try {
    const reply = await fetch(POCKET, { cache: 'no-store' });
    const list = await reply.json();
    if (!reply.ok) throw new Error(list.error || reply.status);
    pocket = list; pocketError = null;
  } catch {
    pocketError = "Can't reach the pocket on jacks-mac-pro right now.";
  }
  if (pocket && pocketSeen === null) { markPocketSeen(); if (pocketSeen === null) { pocketSeen = 0; store.set('pocketSeen', 0); } }
  else if (pocket && before) {
    // Quietly: what other devices put in since the last look. A badge, and at most one short bubble.
    const had = new Set(before.items.map(i => i.id));
    const fresh = pocket.items.filter(i => !had.has(i.id) && i.device !== myName() && i.t > (pocketSeen || 0));
    if (fresh.length && !document.body.classList.contains('open'))
      speak('Pocket', fresh.length === 1 ? `${fresh[0].device} put ${fresh[0].name} in the pocket.` : `${fresh.length} new things in the pocket.`, { ms: 6000, job: 'tailshare' });
  }
  // Redrawing rebuilds every tile (thumbnails reload, the pointer's hover resets), so only when something changed.
  const now = JSON.stringify([pocket?.items, pocketError]);
  if (now === pocketDrawn) return;
  pocketDrawn = now;
  if (showing()) render(); else renderJobs();
}

async function pocketPin(id) {

  catch { pocketSay("Couldn't reach the pocket"); }
  fetchPocket();
}
async function pocketRemove(id) {
  if (pocket) { pocket.items = pocket.items.filter(i => i.id !== id); render(); }

}

/* A new arrival: the sheep says who sent what. Tapping the bubble opens the Tailshare tab. */
function announceArrival(i) {
  const what = i.kind === 'text' ? gist(i.text) || 'Some text' : i.kind === 'image' ? 'Sent you a picture.' : 'Sent you ' + i.name;
  nudge(); face('down'); fx('happy', 1100);

/* ---------------------------------------------------------------- what it says */
let bubbleTimer = null, typing = null, bubbleFor = null, bubbleJob = null;

let style = store.get('bubble', null);   // the chosen speech-bubble frame's name, '' for the drawn box

function frames() {
  // Every speech-bubble frame the machines serve (pet/ui), each once.
  const seen = new Map();
  for (const m of data?.machines || [])
    for (const u of m.report?.machine?.ui || [])
      if (!seen.has(u.name) && m.address) seen.set(u.name, { ...u, url: `http://${m.address}:8479/v1/ui/${encodeURIComponent(u.name)}/frame.png${u.v ? '?v=' + u.v : ''}` });
  return [...seen.values()];
}

function frameUI() {
  // The chosen frame; with no choice yet, the game's default box ('…-message') when there is one.
  const list = frames();
  if (style === '') return null;
  return list.find(u => u.name === style) || list.find(u => /-message$/.test(u.name)) || list[0] || null;
}

// The game's own font, when a reporter serves one (pet/ui/fonts): loaded once, used in the speech bubble at a
// whole multiple of its pixel size so it stays crisp.
let gameFont = null;
function fontUI() {
  for (const m of data?.machines || [])
    for (const f of m.report?.machine?.fonts || [])
      if (m.address) return { ...f, url: `http://${m.address}:8479/v1/fonts/${encodeURIComponent(f.name)}/font.ttf${f.v ? '?v=' + f.v : ''}` };
  return null;
}
function loadFont() {
  const f = fontUI();
  if (!f || gameFont?.url === f.url || !window.FontFace) return;
  gameFont = { ...f, ready: false };
  const face = new FontFace(f.family || 'HerdGame', `url("${f.url}")`);
  face.load().then(loaded => { document.fonts.add(loaded); if (gameFont.url === f.url) gameFont.ready = true; })
    .catch(() => { gameFont = null; });
}

function dress() {
  const b = $('bubble'), box = b.querySelector('.box'), ui = frameUI();
  loadFont();
  // One font pixel per CSS px: crisp on any screen, about the size the game's own box reads at.
  const px = gameFont?.px || 16, zoom = 1;
  const font = gameFont?.ready ? `font:400 ${px * zoom}px/${(px + 1) * zoom}px "${gameFont.family || 'HerdGame'}";-webkit-font-smoothing:none;letter-spacing:0;` : '';
  const shade = colour => gameFont?.ready && gameFont.text_shadow
    ? `text-shadow:${gameFont.text_shadow.map(([x, y]) => `${x * zoom}px ${y * zoom}px 0 ${colour}`).join(',')};`
    : `text-shadow:1px 1px 0 ${colour};`;
  b.classList.toggle('game-font', !!font);
  b.classList.toggle('framed', !!ui);
  if (!ui) { box.style.cssText = font; b.style.removeProperty('--tail-edge'); b.style.removeProperty('--tail-fill'); return; }
  // The frame's white text area is the inside; its edge is drawn as the border, the same width on both sides.
  const cut = ui.bubble?.slice || ui.slice, k = ui.scale || 2;
  const [t, r, bt, l] = cut;
  box.style.cssText = `border-width:${t * k}px ${r * k}px ${bt * k}px ${l * k}px;` +
    `border-image:url("${ui.url}") ${t} ${r} ${bt} ${l} / ${t * k}px ${r * k}px ${bt * k}px ${l * k}px stretch;` +
    `background:${ui.fill || '#fff'};background-clip:padding-box;padding:3px 6px 5px;` +
    (ui.text ? `color:${ui.text};` : '') + (ui.shadow ? shade(ui.shadow) : '') + font;
  if (ui.bubble?.edge) b.style.setProperty('--tail-edge', ui.bubble.edge);
  if (ui.fill) b.style.setProperty('--tail-fill', ui.fill);
  if (ui.edge) b.style.setProperty('--tail-edge', ui.edge);
}

/* Says something: who it's about, then the words typed out. Tapping it opens that session. It asks the shell for
   room first, so the box is never cut off by the window. */
function speak(who, text, { ms = 7000, id = null, job: about = null } = {}) {
  if (document.body.classList.contains('open')) return;
  if (native && !caps.room) return;   // a shell that can't make room would cut it off; the badge says enough
  const b = $('bubble');
  dress();
  b.querySelector('.who').textContent = who || '';
  b.querySelector('.who').style.display = who ? '' : 'none';
  const say = b.querySelector('.say');
  bubbleFor = id; bubbleJob = about;
  // Measured at full length, so the box doesn't grow while it types.
  say.textContent = text; b.classList.remove('typed');
  const height = b.querySelector('.box').offsetHeight + 12;
  if (caps.room) shell({ cmd: 'room', w: 280, h: 132 + height });
  say.textContent = '';
  b.classList.add('on');
  clearInterval(typing);
  let i = 0;
  typing = setInterval(() => {
    i += 2;
    say.textContent = text.slice(0, i);
    if (i >= text.length) { clearInterval(typing); b.classList.add('typed'); }
  }, 32);
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(hush, ms);
}

function hush() {
  const b = $('bubble');
  if (!b.classList.contains('on')) return;
  b.classList.remove('on', 'typed'); clearInterval(typing); bubbleFor = null; bubbleJob = null;
  if (caps.room && !document.body.classList.contains('open')) setTimeout(() => { if (!b.classList.contains('on')) shell({ cmd: 'room' }); }, 180);
}
function flash(text) { speak('', text, { ms: 1400 }); }

$('bubble').addEventListener('click', () => {
  const id = bubbleFor, about = bubbleJob;
  hush();
  if (about) { job = about; detail = null; store.set('job', job); }
  toggle(true);
  if (id) { job = 'agents'; detail = { id, loading: true }; render(); shell({ cmd: 'show', id }); if (!native) mockDetail(id); }
});

/* The first sentence of an agent's last words, short enough for the box. */
function gist(text) {
  const t = String(text || '').replace(/[*_`#>]/g, '').replace(/\s+/g, ' ').trim();
  const first = (t.match(/^.{12,}?[.!?](\s|$)/) || [t])[0].trim();
  return first.length > 120 ? first.slice(0, 117) + '…' : first;
}

/* ---------------------------------------------------------------- its mood, from the agents */
let moodNow = 'idle';   // offline | alert | work | idle

function mood() {
  const list = sessions();
  const need = list.filter(s => s.state === 'needs-you');
  const fresh = list.filter(isUnseen);
  const working = list.filter(s => s.state === 'working');
  const reached = (data?.machines || []).some(m => m.report);
  const was = moodNow;
  moodNow = !reached ? 'offline' : need.length ? 'alert' : working.length ? 'work' : 'idle';
  if (was !== moodNow) nudge();
  dressUp();
  const badge = $('badge'), count = need.length + fresh.length;
  badge.textContent = count; badge.className = count ? 'on' + (need.length ? '' : ' ready') : '';
  const parts = [];
  if (need.length) parts.push(need.length + ' need' + (need.length > 1 ? '' : 's') + ' you');
  if (fresh.length) parts.push(fresh.length + ' finished');
  if (working.length) parts.push(working.length + ' working');
  const machines = (data?.machines || []).filter(m => m.report).length;
  $('summary').textContent = data?.error && !machines ? 'Out of reach' : (parts.join(' · ') || 'All quiet') + ` · ${machines} machine${machines === 1 ? '' : 's'}`;
}

// What it last said about each session, so one finish is announced once, however the state wobbles after.
const told = {};

function announce(list) {
  for (const s of list) {
    const was = previous[s.id];
    if (was && was !== s.state) {
      const news = s.state + ':' + (s.last || '');
      if (told[s.id] === news) continue;
      told[s.id] = news;
      if (s.state === 'needs-you') {
        face('down');
        speak(s.title, s.ask || ('Needs you! ' + (gist(s.last) || 'It\'s waiting on an answer.')), { ms: 9000, id: s.id });
      } else if (s.state === 'your-turn' && was === 'working') {
        face('down'); fx('happy', 1100);
        speak(s.title, gist(s.last) || 'All done!', { ms: 8000, id: s.id });
      }
    }
  }
  previous = Object.fromEntries(list.map(s => [s.id, s.state]));
}

/* ---------------------------------------------------------------- its life: walking about, fidgets, naps */
const caps = { stroll: false, room: false };   // what the shell can do for it; the Mac says so with herd.caps()
const NAP_AFTER = 2 * 60 * 1000;              // this long with nothing happening, and it naps
const ROAM = 220;                             // how far from where it was put down it wanders, in px
let facing = 'down', walking = false, step = 0, stepper = null;
let activity = 'stand';                       // stand | walk | fidget | nap | held
let lastNudge = Date.now(), plan = null, life = 0;
let roamed = 0;                               // px from where it was last put down (+ is right)
let arrive = null;                            // resolves the stroll the shell is walking
let blocked = 0;                              // the side it last bumped into (an edge of the screen): -1, 0 or 1
const effects = new Set();

const wait = ms => new Promise(go => setTimeout(go, ms));
const chance = p => Math.random() < p;
const between = (a, b) => a + Math.random() * (b - a);

function dressUp() {
  const pet = $('pet');
  const visual = moodNow === 'offline' ? 'offline' : moodNow === 'alert' ? 'alert' : activity === 'nap' ? 'sleep' : moodNow === 'work' ? 'work' : '';
  pet.className = [visual, skin ? 'skinned' : '', walking ? 'walking' : '', activity === 'held' ? 'held' : '', ...effects].filter(Boolean).join(' ');
  pet.dataset.face = facing;
}

function fx(name, ms) { effects.add(name); dressUp(); setTimeout(() => { effects.delete(name); dressUp(); }, ms); }
function face(where) { facing = where; paint(); dressUp(); }

function startSteps() {
  clearInterval(stepper);
  const fps = look && look.walk.length >= 6 ? 11 : 7;
  stepper = setInterval(() => { step++; paint(); }, 1000 / fps);
}
function stopSteps() { clearInterval(stepper); stepper = null; step = 0; }

/* Something happened (an agent changed, a tap, a drop): wake up, and think again soon. */
function nudge() {
  lastNudge = Date.now();
  life++;   // whatever it was in the middle of stops at its next beat
  if (activity === 'nap') { activity = 'stand'; fx('stretch', 900); }
  think(400);
}

/* Walks dx px sideways at speed px/s. The Mac moves its window along the screen; a page in a browser moves itself;
   a shell that can't move it walks on the spot for a moment. Resolves with how far it really went. */
function stroll(dx, speed) {
  return new Promise(done => {
    face(dx < 0 ? 'left' : 'right');
    walking = true; activity = 'walk'; startSteps(); dressUp();
    const finish = moved => {
      if (!walking) return;
      walking = false; stopSteps(); arrive = null; roamed += moved;
      blocked = Math.abs(moved) < Math.abs(dx) * .3 ? Math.sign(dx) : 0;
      if (activity === 'walk') activity = 'stand';
      paint(); dressUp(); done(moved);
    };
    const takes = Math.abs(dx) / speed * 1000;
    if (caps.stroll) {
      arrive = finish;
      shell({ cmd: 'stroll', dx: Math.round(dx), speed });
      setTimeout(() => finish(dx), takes + 2500);   // in case the shell never answers
    } else if (!native) {
      const pet = $('pet'), room = Math.max(0, innerWidth - 140);
      const to = Math.max(-room, Math.min(0, roamed + dx));
      if (Math.abs(to - roamed) < 8) return finish(0);
      pet.style.transition = `transform ${takes}ms linear`;
      pet.style.transform = `translateX(${to}px)`;
      setTimeout(() => finish(to - roamed), takes);
    } else {
      setTimeout(() => finish(0), Math.min(1400, takes));
    }
  });
}

/* The small things it does while standing about. */
const fidgets = {
  async lookAround(beat) {
    for (const where of chance(.5) ? ['left', 'right'] : ['right', 'left']) {
      face(where); await wait(between(500, 900)); if (beat !== life) return;
    }
    face('down');
  },
  async peek(beat) { face('up'); await wait(between(900, 1600)); if (beat === life) face('down'); },
  async hop() { face('down'); fx('happy', 1100); await wait(1100); },
  async stretch() { fx('stretch', 900); await wait(900); },
};

function pickFidget() {
  const r = Math.random();
  return r < .45 ? fidgets.lookAround : r < .7 ? fidgets.peek : r < .85 ? fidgets.stretch : fidgets.hop;
}

/* Its next beat: stand still, take a few steps, fidget, or nod off. One beat at a time; anything that happens in
   between (nudge) starts a new one. */
function think(ms) {
  clearTimeout(plan);
  plan = setTimeout(beat, ms);
}

async function beat() {
  const mine = ++life;
  const open = document.body.classList.contains('open'), talking = $('bubble').classList.contains('on');
  if (activity === 'held' || walking) return think(1500);
  if (open || talking || moodNow === 'offline') { if (facing !== 'down') face('down'); return think(2500); }
  if (moodNow === 'alert') { face('down'); return think(3000); }
  if (activity === 'nap') return think(20000);
  if (moodNow === 'idle' && Date.now() - lastNudge > NAP_AFTER) {
    face('down'); activity = 'nap'; dressUp(); return think(20000);
  }
  // Heads back toward where it was put down when it has strayed too far.
  let homeward = Math.abs(roamed) > ROAM * .7 ? -Math.sign(roamed) : (chance(.5) ? 1 : -1);
  if (homeward === blocked) homeward = -homeward;   // not into the edge it just bumped
  if (moodNow === 'work') {
    const r = Math.random();
    if (r < .5) await stroll(homeward * between(30, 90), 70);
    else if (r < .75) await fidgets.peek(mine);   // looking at its own screen
    else { activity = 'fidget'; await pickFidget()(mine); activity = 'stand'; }
    return mine === life && think(between(1200, 3500));
  }
  const r = Math.random();
  if (r < .4) await stroll(homeward * between(60, ROAM), 38);
  else if (r < .85) { activity = 'fidget'; await pickFidget()(mine); if (activity === 'fidget') activity = 'stand'; }
  if (mine === life) think(between(3500, 9000));
}

function markSeen() {
  for (const s of sessions()) if (s.state === 'your-turn') seen[s.id] = s.updated;
  store.set('seen', seen);
}

/* ---------------------------------------------------------------- called by the native shell */
window.herd = {
  update(json) {
    data = typeof json === 'string' ? JSON.parse(json) : json;
    const list = sessions();
    if (firstRun && !store.get('seen', null)) markSeen();
    announce(list);
    loadFont();
    if (skin) { const s = skins().find(x => x.name === skin.name); if (s && JSON.stringify(pick(s)) !== JSON.stringify(skin)) { skin = pick(s); store.set('skin', skin); wear(); } }
    if (document.body.classList.contains('open')) markSeen();
    mood();
    // The Tailshare tab only changes when the Inbox does (herd.inbox); redrawing it would close opened texts.
    if (document.body.classList.contains('open') && !(detail && job === 'agents') && job !== 'tailshare') render();
  },
  // ~/Inbox changed (the Mac shell sends it when it does). New arrivals make the sheep say so.
  inbox(json) {
    if (caps.test) return;   // the walk's made-up list stays
    const list = typeof json === 'string' ? JSON.parse(json) : json;
    const known = inbox;
    inbox = list;
    if (inboxSeen === null) { markInboxSeen(); if (inboxSeen === null) { inboxSeen = 0; store.set('inboxSeen', 0); } }
    if (known) {
      const had = new Set(known.map(i => i.name));
      const arrived = list.filter(i => !had.has(i.name) && i.t > (inboxSeen || 0));
      if (arrived.length) announceArrival(arrived[0]);
    }
    if (document.body.classList.contains('open') && job === 'tailshare') render(); else renderJobs();
  },
  detail(json) {
    const d = typeof json === 'string' ? JSON.parse(json) : json;
    if (detail && d.session && d.session.id === detail.id) { detail = { id: d.session.id, turns: d.turns, note: d.note, session: { ...d.session, machine: d.machine }, machine: d.machine }; render(); }
    if (d.error && detail) { detail.loading = false; detail.note = d.error; render(); }
  },
  // Files dropped on the sheep or the panel are on their way into the pocket: show the tab.
  pocketDropped(names) {
    job = 'tailshare'; detail = null;
    if (!document.body.classList.contains('open')) toggle(true); else render();
    nudge();
  },
  // Files are being dragged over the open panel (true) or left it (false): the whole panel lights up as the target.
  dragging(on) {
    document.body.classList.toggle('dropping', !!on);
    if (on && document.body.classList.contains('open') && job !== 'tailshare') { job = 'tailshare'; detail = null; render(); }
  },
  sent(text) { const el = $('sendStatus'); if (el) el.textContent = text; flash(text); },
  // An upload into the pocket: {name, state: zipping | uploading | done | failed, error}.
  pocketBusy(b) {
    b = typeof b === 'string' ? JSON.parse(b) : b;
    if (b.state === 'done') { pocketBusy.delete(b.name); fetchPocket(); }
    else pocketBusy.set(b.name, b);
    if (b.state === 'failed') setTimeout(() => { pocketBusy.delete(b.name); if (showing()) render(); }, 8000);
    if (showing()) render();
  },
  // A pull finished: {id, action, error?}.
  pocketPulled(r) {
    r = typeof r === 'string' ? JSON.parse(r) : r;
    const item = pocket?.items.find(i => i.id === r.id);
    // Opening shows itself; only a copy, a save or a failure needs saying.
    if (r.error || r.action !== 'open')
      pocketSay(r.error ? "Couldn't get it: " + r.error : { copy: 'Copied', save: 'Saved to Downloads/Pocket' }[r.action] + (item ? ': ' + item.name : ''), r.error ? 8000 : 2500);
  },
  tap() { nudge(); toggle(); },
  // Android's back: it ends choosing first, then closes the panel.
  back() { if (selecting) endSelect(); else this.tap(); },
  // `herd pet tab NAME`: shows that tab (agents, look, tailshare), opening the panel if it's closed.
  tab(name) { if (!jobs.some(j => j.id === name)) return; job = name; detail = null; store.set('job', job); if (!document.body.classList.contains('open')) toggle(true); else render(); },
  // A note from the Fold's shell in place of its own card (Boss, 2026-10-17: the cards are too big while playing; with the
  // sheep on screen they come through it): {who, text, ms}.
  note(n) {
    n = typeof n === 'string' ? JSON.parse(n) : n;
    if (!n || !n.text) return;
    nudge(); face('down');
    speak(n.who || '', String(n.text), { ms: n.ms || 9000 });
  },
  // `herd say TEXT`: says it; an empty text says what's up.
  say(text) { if (text) { nudge(); face('down'); speak('', String(text), { ms: 8000 }); } else herd.chat(); },
  // "What's up?": says what the agents are doing, most urgent first.
  chat() {
    nudge();
    const list = sessions(), need = list.filter(s => s.state === 'needs-you'), busy = list.filter(s => s.state === 'working');
    const fresh = list.filter(isUnseen);
    const top = need[0] || fresh[0] || busy[0];
    const parts = [need.length && `${need.length} need${need.length > 1 ? '' : 's'} you`, fresh.length && `${fresh.length} just finished`,
                   busy.length && `${busy.length} working`].filter(Boolean);
    if (!top) return speak('', moodNow === 'offline' ? "I can't reach the herd. Is Tailscale on?" : 'All quiet. Nobody is working right now.');
    speak(top.title, (parts.join(', ') + '. ').replace(/^./, c => c.toUpperCase()) + (gist(top.last) || ''), { ms: 9000, id: top.id });
  },
  // The shell's abilities: {stroll: it can walk the window along the screen, room: it can grow for the bubble; pocket and
  // sendclip for the Tailshare tab; os 'linux' for Omarchy's (pet/linux/herd-pet), which also posts as window.HerdAndroid}.
  caps(c) {
    Object.assign(caps, typeof c === 'string' ? JSON.parse(c) : c);
    if (caps.pocket && window.HerdAndroid) { fetchPocket(); renderJobs(); }
    if (showing()) render();   // a phone's sendclip shows the send row at once
  },
  // A stroll the shell walked is over; moved is how far it got (less than asked at the screen's edge).
  arrived(r) { const moved = (typeof r === 'string' ? JSON.parse(r) : r)?.moved ?? 0; if (arrive) arrive(moved); },
  // Which side of the window the pet stands on: the shell grows the window away from the screen's edge.
  side(s) { document.body.classList.toggle('left', s === 'left'); },
  // Being carried (true) and put down (false). Where it's put down becomes its new home ground.
  held(on) {
    if (on) { if (walking && arrive) arrive(0); activity = 'held'; face('down'); }
    else { activity = 'stand'; roamed = 0; fx('landed', 400); nudge(); setTimeout(() => fidgets.lookAround(life), 500); }
    dressUp();
  },
};

// The room the window gives, measured: Android's WebView keeps 100vh at the size it was when the page loaded, so a
// panel sized by it would stay as small as the closed sheep after the view grows.
function measure() { document.documentElement.style.setProperty('--room', window.innerHeight + 'px'); }
window.addEventListener('resize', measure);
measure();

function toggle(force) {
  const open = force ?? !document.body.classList.contains('open');
  document.body.classList.toggle('open', open);
  shell({ cmd: open ? 'expand' : 'collapse' });
  for (const wait of [0, 50, 200, 500]) setTimeout(measure, wait);   // the view grows a moment after it's asked to
  if (!open) { hideMenu(); quitSelect(); }
  if (open) { markSeen(); mood(); render(); hush(); fetchPocket(); }
}
$('close').addEventListener('click', () => toggle(false));
wear();
// Whether the pointer is over the open panel: ⌘V only puts things in the pocket then. Dictation apps (Wispr Flow)
// type by pasting into whatever has the keyboard, which once put a sentence meant for another app in the pocket.
let pointerOnPanel = false;
$('panel').addEventListener('mouseenter', () => { pointerOnPanel = true; });
$('panel').addEventListener('mouseleave', () => { pointerOnPanel = false; });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (selecting) endSelect(); else toggle(false); }
  // ⌘V over the open panel puts what's on the clipboard into the pocket (the Mac shell reads the clipboard).
  if (e.metaKey && e.key.toLowerCase() === 'v' && native && !window.HerdAndroid && document.body.classList.contains('open')
      && pointerOnPanel && !e.target.closest?.('input, textarea, [contenteditable]')) {
    e.preventDefault();
    if (job !== 'tailshare') { job = 'tailshare'; detail = null; store.set('job', job); render(); }
    shell({ cmd: 'pocketpaste' });
  }
});

const pet = $('pet');
// On the Mac the shell owns presses on the sheep (tap, drag, menu) and calls herd.tap(); elsewhere a click is a tap.
const shellOwnsSheep = !!window.webkit?.messageHandlers?.herd;
pet.addEventListener('click', () => { if (!shellOwnsSheep) { nudge(); toggle(); } });
think(1500);
pet.addEventListener('contextmenu', e => e.preventDefault());

/* ---------------------------------------------------------------- preview in a browser, with sample data */
function mockDetail(id) {
  setTimeout(() => herd.detail({ machine: 'jacks-mac-pro', session: sessions().find(s => s.id === id), turns: [
    { who: 'you', text: 'Add the reactions row under each post.' },
    { who: 'agent', text: 'Done. Reactions sit under each post and update live. Tests pass (42). Want me to ship it to the Fold build?' }] }), 300);
}
if (!native) {
  const now = Date.now() / 1000;
  herd.update({ machines: [
    { name: 'macbook-pro', self: true, address: '100.105.137.74', report: { machine: { load: 3.1, remote_control: [],
      skins: [{ name: 'crono', frames: 7, frame: [64, 64], display: 160, rows: ['down', 'up', 'left', 'right'], stand: 0, walk: [1, 2, 3, 4, 5, 6] }]
        .concat(['pikachu', 'mudkip', 'gengar', 'eevee', 'torchic'].map(name => ({ name, frames: 2 }))) }, sessions: [
      { id: 'add7d44a', title: 'Agent/machine visibility tool', project: 'herd', app: 'desktop', kind: 'claude', state: 'working', updated: now - 5, cwd: '/Users/jackkim/ClaudeSync/projects/herd' },
      { id: 'b4ba7534', title: 'Trading view widget planning', project: 'omalauncher', app: 'desktop', kind: 'claude', state: 'your-turn', updated: now - 7200, cwd: '/Users/jackkim/ClaudeSync/projects/omalauncher' }] } },
    { name: 'jacks-mac-pro', report: { machine: { load: 2.5, remote_control: ['Mac Pro'] }, sessions: [
      { id: 't9f45b7c', title: 'Pond reactions row', project: 'pond', app: 'oma', kind: 'claude', state: 'needs-you', updated: now - 90, cwd: '/Users/jackkim/Projects/pond' }] } },
    { name: 'omarchy-mg1', report: { machine: { load: 0, remote_control: [], gpu: { used_mb: 28000, total_mb: 32600, busy: 97 } }, sessions: [] } },
    { name: 'galaxy-z-fold8', os: 'android', report: { machine: { os: 'android', load: 4.1 }, sessions: [
      { id: 'fold-builder-a', title: 'Fold in the herd', project: 'Phone builder A', app: 'fold', kind: 'claude', state: 'working', updated: now - 20, cwd: '/root' }] } },
    { name: 'omarchy-mbp', error: 'no herd here' }],
    others: [{ name: 'iphone171', online: true }, { name: 'mg1', online: false }] });
  herd.inbox([
    { name: 'clip-20261016-004422-from-galaxy-z-fold8.txt', kind: 'text', from: 'galaxy-z-fold8', t: now - 120, size: 300,
      text: 'Look at the herd pet README and tell me what the Fold still needs before the sheep can ship on the real phone.\n\nThen check the herd-pet branch builds.' },
    { name: 'clip-20261016-001619-from-galaxy-z-fold8.png', kind: 'image', from: 'galaxy-z-fold8', t: now - 3600, size: 146129 },
    { name: 'invoice.pdf', kind: 'file', t: now - 86400 * 2, size: 241000 }]);
}
