# Riso, after design/oma-scrapbook-prototype.html ("rs"): two inks out of register. Blue on
# speckled paper, a pink second run under every scrap, pink tape, and a pen that overprints.
#
# What it leaves out is Console's (assets/packs/console/pack.toml).
# Its fonts are the prototype's, in fonts/ (SIL Open Font License); each voice also names the nearest system family as a fallback.
[pack]
format = 1
name = "Riso"

# The paper is the background too, so panels and what widgets draw are on the same stock.
[palette]
mode = "light"
background = "#e7e5ee"
surface = "#d9d6e6"
foreground = "#2337ff"
muted = "foreground@0.65"
accent = "#ff3d8b"
border = "foreground"
red = "#ff3d8b"
green = "#2337ff"
on_page = "foreground"
highlight = "accent"
alt = "foreground"
on_alt = "background"
overlay = "background@0.94"
glass = "background"

[type.display]
family = "sans-serif"
file = "fonts/DelaGothicOne-Regular.ttf"
weight = 400

[type.body]
family = "sans-serif"
file = "fonts/SchibstedGrotesk-Regular.ttf"

[type.hand]
family = "cursive"
file = "fonts/Caveat-Bold.ttf"
weight = 700

[type.mono]
family = "monospace"
file = "fonts/JetBrainsMono-Medium.ttf"
uppercase = true
tracking = 0.09

[shape]
radius = 0
corners = "edge"

# The prototype leans its scraps up to four degrees; on a grid with a 6dp gap that would run
# one tile over the next, so they lean less here.
[scrap]
# Focus is the blue again at twice the weight: the pink is under 3 to 1 on this paper, and 2 to 1
# against the blue outline it would replace.
fill = "background"
ink = "foreground"
border = 2
border_color = "foreground"
muted = "muted"
tilt_min = -1.6
tilt_max = 1.6
focus_color = "foreground"
focus_width = 4

[scrap.shadow]
x = 5
y = 5
color = "accent"

[scrap.alt]
fill = "foreground"
ink = "background"
border = 2
border_color = "foreground"
focus_color = "background"
focus_width = 4

[scrap.tape]
style = "solid"
color = "accent"
opacity = 0.9
width = 66
height = 21
angle = -3

[scrap.sticky]
fill = "accent"
ink = "#26241f"
border = 0

[page]
kind = "paper"
color = "background"
pattern = "dots"
pattern_color = "foreground@0.1"
pattern_size = 5
pattern_weight = 2
gutter = true
drawer_fill = "background@0.97"
focus_color = "foreground"

[icons]
treatment = "original"
tint = "foreground"

[icons.placeholder]
style = "letter"
font = "display"
fill = "surface"
ink = "foreground"

# The ring runs pink into blue in every state, as the prototype's does.
[ring.needs_you]
color1 = "accent"
color2 = "foreground"

[ring.done]
color1 = "accent"
color2 = "foreground"

[ink]
pen = "foreground"
second = "accent"
highlighter = "accent@0.5"
blend = "multiply"

[dock]
style = "buttons"
tilt = 2.5
fill = "background"
ink = "foreground"
border = 2
border_color = "foreground"
focus_color = "foreground"
focus_width = 4

[dock.shadow]
x = 5
y = 5
color = "accent"
