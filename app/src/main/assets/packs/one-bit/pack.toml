# 1-bit, after design/oma-scrapbook-prototype.html ("ob"): black and white and nothing else.
# A dithered desktop, hard-edged windows with ruled title bars, and white plates under any text
# that would otherwise sit on the dither.
#
# A token it leaves out takes the base value (theme/pack/PackSchema.kt). Design in this look as
# it is drawn (soma-theme gives its full tokens), never in the base or in Console.
# Its fonts are the prototype's, in fonts/ (SIL Open Font License); each voice also names the nearest system family as a fallback.
[pack]
format = 1
name = "1-bit"

# Two colors: red and green are black as well, so what they mark is told by its words.
[palette]
mode = "light"
background = "#ffffff"
surface = "#ffffff"
foreground = "#000000"
muted = "#000000"
accent = "#000000"
border = "#000000"
red = "#000000"
green = "#000000"
on_page = "#000000"
highlight = "#000000"
alt = "#000000"
on_alt = "#ffffff"
overlay = "#ffffff@0.9"
glass = "#ffffff"

[type.display]
family = "monospace"
file = "fonts/PixelifySans-Regular.ttf"
weight = 400

[type.body]
family = "monospace"
file = "fonts/PixelifySans-Regular.ttf"

[type.hand]
family = "monospace"
file = "fonts/PixelifySans-SemiBold.ttf"
weight = 600

[type.mono]
family = "monospace"
file = "fonts/JetBrainsMono.ttf"
weight = 500
uppercase = true
tracking = 0.09

[shape]
radius = 0
corners = "edge"

[scrap]
# With two colors, focus is weight: the black outline at twice its width.
fill = "#ffffff"
ink = "#000000"
border = 2
border_color = "#000000"
focus_color = "#000000"
muted = "#000000"
focus_width = 4

[scrap.shadow]
x = 3
y = 3
color = "#000000"

[scrap.alt]
fill = "#000000"
ink = "#ffffff"
border = 2
border_color = "#000000"
focus_color = "#ffffff"
focus_width = 4

[scrap.alt.shadow]
x = 3
y = 3
color = "#000000"

# Ruled like an old window's: black lines on white, with a line under it.
[scrap.title_bar]
style = "stripes"
height = 18
fill = "#000000"
ink = "#ffffff"
border = 2

[scrap.sticky]
fill = "#ffffff"
ink = "#000000"
border = 2
border_color = "#000000"
dashed = true

# The dither: a checker of 2dp squares. Text on it gets a plate of the paper.
[page]
kind = "paper"
color = "#ffffff"
pattern = "checker"
pattern_color = "#000000"
pattern_size = 2
pattern_weight = 1
gutter = true
plate = "paper"
drawer_fill = "#ffffff"
focus_color = "#000000"

[icons]
treatment = "grayscale"
tint = "#000000"
contrast = 1.5
shadow = true

[icons.placeholder]
style = "letter"
font = "display"
fill = "#ffffff"
ink = "#000000"
border = 2
border_color = "#000000"

# A bare line, black running into white, with the prototype's soft glow behind it.
[ring]
width = 2

[ring.listening]
color1 = "#000000"
color2 = "#ffffff"

[ring.working]
color1 = "#000000"
color2 = "#ffffff"

[ring.needs_you]
color1 = "#000000"
color2 = "#ffffff"

[ring.done]
color1 = "#000000"
color2 = "#ffffff"

[ink]
pen = "#000000"
second = "#000000"
highlighter = "#000000@0.5"

[dock]
style = "buttons"
tilt = 0
fill = "#ffffff"
ink = "#000000"
border = 2
border_color = "#000000"
focus_color = "#000000"
focus_width = 4

[dock.shadow]
x = 3
y = 3
color = "#000000"
