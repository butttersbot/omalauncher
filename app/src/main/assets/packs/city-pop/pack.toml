# City Pop, after design/oma-scrapbook-prototype.html ("cp") and Hiroshi Nagai's poolsides:
# a cobalt sky, white cards with hard noon shadows, a turquoise pool, pink and yellow for
# everything lit.
#
# The prototype lays a painted wallpaper over the cobalt, one for each display, and this look
# ships both, lifted from the prototype itself: paper/cover.jpg (760 by 1216) for the folded
# display and paper/inner.jpg (1140 by 861) for the unfolded one. The page picks by the window's
# shape and crops it to cover; the cobalt shows only until the image has decoded. There is no
# gutter, and the overview lays a thin white veil over each page.
#
# A token it leaves out takes the base value (theme/pack/PackSchema.kt). Design in this look as
# it is drawn (soma-theme gives its full tokens), never in the base or in Console.
# Its fonts are the prototype's, in fonts/ (SIL Open Font License); each voice also names the nearest system family as a fallback.
[pack]
format = 1
name = "City Pop"

# The background is a card's white, not the sky: panels are cards too, and what widgets draw
# sits on a scrap. The sky is the page, below.
#
# Changed from the prototype so text can be read (4.5 to 1 on the background and the surface):
#   accent  #ff4f9a is 3.1 to 1 on white; darkened to #bd3a72. The tape, the focus line and
#           the ring keep the prototype's pink.
#   muted   the ink at 0.62 is 4.2 to 1 on white and 4.1 on the surface; 0.68 here.
# Not in the prototype at all: surface (the pool's turquoise, thinned on white), border, and
# red and green, which are picked to read on both.
[palette]
mode = "light"
background = "#ffffff"
surface = "#dff7f7"
foreground = "#12296b"
muted = "foreground@0.68"
accent = "#bd3a72"
border = "foreground@0.55"
red = "#c33d41"
green = "#257b47"
on_page = "#ffffff"
highlight = "#ffe14d"
alt = "#19c3c9"
on_alt = "#0b2260"
overlay = "background@0.94"
glass = "background"

[type.display]
family = "sans-serif"
file = "fonts/Montserrat-ExtraBoldItalic.ttf"
weight = 800
italic = true
uppercase = true
tracking = -0.02

[type.body]
family = "sans-serif"
file = "fonts/SchibstedGrotesk.ttf"

[type.hand]
family = "cursive"
file = "fonts/Caveat.ttf"
weight = 700

[type.mono]
family = "monospace"
file = "fonts/JetBrainsMono.ttf"
weight = 500
uppercase = true
tracking = 0.09

[shape]
radius = 2
corners = "round"

# Nothing leans (--rot is 0). The shadow is the prototype's: 7 down and across, hard, in the
# cobalt's own shade at .55; the dock's buttons and the search field cast the same.
[scrap]
fill = "background"
ink = "foreground"
border = 0
border_color = "foreground"
focus_color = "#ff4f9a"
muted = "muted"
# No color stands 3 to 1 off both white and this cobalt, so the line is doubled: pink inside the
# edge, the page's yellow outside it.
focus_width = 4

[scrap.shadow]
x = 7
y = 7
color = "#8c081c60"

# The pool. With no outline of its own, a panel still gets a hairline in the ink. The pink
# is lost on turquoise (1.4 to 1), so here the focus line is the pool's own ink.
[scrap.alt]
fill = "alt"
ink = "on_alt"
border = 0
border_color = "foreground"
focus_color = "on_alt"
focus_width = 4

[scrap.alt.shadow]
x = 7
y = 7
color = "#8c081c60"

[scrap.tape]
style = "solid"
color = "#ff4f9a"
opacity = 0.9
width = 66
height = 21
angle = -3

[scrap.sticky]
fill = "highlight"
ink = "#26241f"
border = 0

[page]
# The cobalt is what shows before a wallpaper decodes. A focused bare icon is outlined in the
# yellow: the pink is 2.3 to 1 on the cobalt.
kind = "wallpaper"
color = "#0f4fc9"
pattern = "none"
wallpaper_cover = "paper/cover.jpg"
wallpaper_inner = "paper/inner.jpg"
gutter = false
# rgba(255,255,255,.2) over each page in the overview (the prototype blurs it too, which a
# scrim cannot say).
overview_scrim = "#33ffffff"
# The app list: rgba(10,48,150,.9).
drawer_fill = "#e60a3096"
focus_color = "highlight"

[page.text_shadow]
x = 0
y = 2
color = "#bf081c60"

[icons]
treatment = "original"
tint = "foreground"
shadow = true

# The prototype's .ico: a card with the tile's shadow.
[icons.placeholder]
style = "letter"
font = "display"
fill = "background"
ink = "foreground"
border = 0

[icons.placeholder.shadow]
x = 7
y = 7
color = "#8c081c60"

# Pink running into yellow in every state, as the prototype's does.
[ring.listening]
color1 = "#ff4f9a"
color2 = "#ffe14d"

[ring.working]
color1 = "#ff4f9a"
color2 = "#ffe14d"

[ring.needs_you]
color1 = "#ff4f9a"
color2 = "#ffe14d"

[ring.done]
color1 = "#ff4f9a"
color2 = "#ffe14d"

[ink]
pen = "#ffffff"
second = "#ff4f9a"
highlighter = "highlight@0.5"

# The dock's buttons are cards with the tile's shadow, and lean 2.5 times --rot, which is none.
[dock]
style = "buttons"
tilt = 0
fill = "background"
ink = "foreground"
border = 0
border_color = "foreground"
focus_color = "#ff4f9a"
focus_width = 4

[dock.shadow]
x = 7
y = 7
color = "#8c081c60"
