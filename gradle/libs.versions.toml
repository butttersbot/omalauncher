[versions]
agp = "9.4.1"
kotlin = "2.4.20"
compose-multiplatform = "1.12.1"
androidx-activity = "1.13.0"
androidx-window = "1.5.0"
androidsvg = "1.4"
commons-compress = "1.28.0"
zxing = "3.5.4"
pdfbox-android = "2.0.27.0"
litertlm = "0.18.0"
junit = "4.13.2"
org-json = "20260814"

[libraries]
# Chromium for HTML artifacts on the desktop (docs/CHAT-ARTIFACT-WORKSPACE.md, "Desktop HTML engine"). Its natives are not
# a dependency: soma-release publishes them pinned (tools/soma-release/engine.json) and the update pill installs them.
jcefmaven = { module = "me.friwi:jcefmaven", version = "152.0.6" }
java-keyring = { module = "com.github.javakeyring:java-keyring", version = "1.0.4" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-window = { module = "androidx.window:window", version.ref = "androidx-window" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
junit = { module = "junit:junit", version.ref = "junit" }
org-json = { module = "org.json:json", version.ref = "org-json" }
androidsvg = { module = "com.caverock:androidsvg-aar", version.ref = "androidsvg" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
pdfbox-android = { module = "com.tom-roush:pdfbox-android", version.ref = "pdfbox-android" }
litertlm-android = { module = "com.google.ai.edge.litertlm:litertlm-android", version.ref = "litertlm" }

[plugins]
compose-desktop = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
